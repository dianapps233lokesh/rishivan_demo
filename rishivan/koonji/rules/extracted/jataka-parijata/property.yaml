          dignity: dignity.debilitated
      - varga_dignity:
          varga: varga.d60
          subject: lord.bhava.04
          dignity: dignity.inimical
    - any:
      - conjunct:
          subject: lord.bhava.04
          other: graha.mars
      - conjunct:
          subject: lord.bhava.04
          other: graha.sun
      - conjunct:
          subject: lord.bhava.04
          other: graha.saturn
      - conjunct:
          subject: lord.bhava.04
          other: graha.rahu
      - conjunct:
          subject: lord.bhava.04
          other: graha.ketu
      - aspects:
          subject: graha.mars
          target: lord.bhava.04
      - aspects:
          subject: graha.sun
          target: lord.bhava.04
      - aspects:
          subject: graha.saturn
          target: lord.bhava.04
      - aspects:
          subject: graha.rahu
          target: lord.bhava.04
      - aspects:
          subject: graha.ketu
          target: lord.bhava.04
  indicates:
    claim: wealth.loss
    polarity: positive
    magnitude: strong
    text: the yoga will lead to the loss of lands and other such sources of livelihood
