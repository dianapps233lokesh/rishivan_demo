- id: PHALADEEPIKA.DIRECTINTERPRETER.CH28V43.X0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: direct_interpreter
  source:
    book: phaladeepika
    edition: phaladeepika-sastri-1950
    locator: ch28.v43
    quote: In the year indicated by the figure obtained by (1) adding the figures
      (of benefic dots) in the houses occupied by benefic planets and (2) then multiplying
      the same by 7 and (3) dividing the result by 27 should the year indicating anything
      auspicious be intimated. On such an occasion, one will, without doubt, obtain
      issue, wealth, happiness, etc.
    quote_sha256: 584712a820e5711d464d197df1b8b2d34d5fc6ad771fe6927732f1b246d9c43e
    authority_tier: S0
    review:
      state: unreviewed
  guidance:
    text: To identify a year for auspicious events such as the birth of a child, acquisition
      of wealth, or general happiness, a calculation is prescribed. First, sum the
      'benefic dots' (commonly interpreted as Sarvashtakavarga bindus) in the houses
      occupied by benefic planets. Second, multiply this sum by 7. Third, divide the
      product by 27. The integer part of this result (the quotient) indicates a year
      in the native's life when these positive events will occur.
    applies_to: method
