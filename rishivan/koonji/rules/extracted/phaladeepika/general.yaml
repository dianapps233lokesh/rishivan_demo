    quote_sha256: df7ea41f47642a13e76ec045d45abb42e3e9ac81e9552b872766993a21104411
    authority_tier: S0
    review:
      state: unreviewed
  guidance:
    text: When the Moon transits a rasi corresponding to an 'unfavourable' natal house
      (contextually implied to be the 2nd, 4th, 5th, 7th, 8th, 9th, or 12th from the
      Lagna), the affairs signified by that house suffer damage.
    applies_to: method
- id: PHALADEEPIKA.DIRECTINTERPRETER.CH28V10.X0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: direct_interpreter
  source:
    book: phaladeepika
    edition: phaladeepika-sastri-1950
    locator: ch28.v10
    quote: In their own, exaltation, friendly or Upachaya places, the planets invariably
      advance the benefic effect revealed by Ashtakavarga.
    quote_sha256: 9e2aaa6318d13fc235e25e72f4de67ca389e581515ac4b923bb024b9ba10c764
    authority_tier: S0
    review:
      state: unreviewed
  guidance:
    text: A planet's capacity to produce benefic effects indicated by Ashtakavarga
      is enhanced if it is natally placed in its own sign, its exaltation sign, a
      friendly sign, or an Upachaya house (3, 6, 10, 11).
    applies_to: method
- id: PHALADEEPIKA.DIRECTINTERPRETER.CH28V10.X0002
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: direct_interpreter
  source:
    book: phaladeepika
    edition: phaladeepika-sastri-1950
    locator: ch28.v10
    quote: In their depression, inimical or Apachaya houses, they generally fail to
      sustain whatever good effect may appear from the Ashtakavarga process.
    quote_sha256: a2294a0b956b820ab7860af16d88cad5473456241da0098b762209887dc21bc8
    authority_tier: S0
    review:
      state: unreviewed
  guidance:
    text: A planet's capacity to deliver good effects indicated by Ashtakavarga is
      diminished if it is natally placed in its sign of depression, an inimical sign,
      or an Apachaya house (any house other than 3, 6, 10, 11).
    applies_to: method
- id: PHALADEEPIKA.DIRECTINTERPRETER.CH28V10.X0003
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: direct_interpreter
  source:
    book: phaladeepika
    edition: phaladeepika-sastri-1950
    locator: ch28.v10
    quote: That is a planet produces very good results when it passes through a Rasi
