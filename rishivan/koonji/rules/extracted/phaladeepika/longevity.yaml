    locator: ch28.v18
    quote: The signs, degrees, minutes, etc., of a planet should be converted into
      minutes, and as many multiples of 2400 as may be found necessary should be subtracted
      from the same The remainder represents the Ayushkalas of the planet. The same
      should be divided by 200 (आशा स्वाश्व—आशा=10 or 0, ख=0, अश्व=2). The quotient
      gives the number of years, months and days in the अंशाायर्दाय (Amsayurdaya)
      contribution towards the span of life by a planet according to its Degree, etc
      , according to Satyacharya. If the planet be retrograde or in exaltation, this
      quotient has to be trebled. If the planet be in his own Rasi or Navamsa, decanate
      or Vargottama, the Ayurdaya has to be doubled; if in depression, it has to be
      reduced by half. If the planet be eclipsed, then also the reduction is half.
      But this last reduction will not apply to Venus and Saturn.
    quote_sha256: c7b15f368027221c6585650b836851de17c8acd0425a78d0c95f9c7341f17e46
    authority_tier: S0
    review:
      state: unreviewed
  guidance:
    text: 'This verse describes Satyacharya''s method for Amsayurdaya calculation.
      For each planet, a base contribution is calculated from its longitude: Years
      = ((Longitude in minutes) mod 2400) / 200. This base value is then modified:
      trebled for a retrograde or exalted planet; doubled for a planet in its own
      Rasi, Navamsa, decanate, or Vargottama; halved for a planet in depression or
      combust. The combustion reduction does not apply to Venus or Saturn.'
    applies_to: method
