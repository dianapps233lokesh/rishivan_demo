- id: BPHS.PROGENY.CH85V916.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.progeny: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch85.v9-16
    quote: 'If Rahu is posited in the 5th house and aspected by Mars or similar combination
      is formed in Aries or Scorpio sign, it will cause childlessness due to the curse of
      the ''Snake'' (नाग).


      When lord of the 5th house conjoins with Rahu and Saturn forms conjunction with or aspects
      the Moon in the 5th house, it will cause loss of children attributed to the curse of
      the ''Snake''.


      Should Jupiter conjoin Rahu, lord of the 5th house is weak, lord of the Ascendant is
      conjunct with Mars, there will be loss of children owing to the curse of the ''Snake''.


      Conjunction of Jupiter and Mars, Rahu''s position in the Ascendant, the 5th lord being
      in a Trik house (6th, 8th, 12th) will also give effect to the childlessness.


      If 5th lord Mercury is in the Navamsa of Mars and conjoined with Mars, the ascendant
      contains Rahu and Mandi, the curse of ''Snake'' will destroy the children (progeny).

      If the 5th house is of the sign of Mars and the 5th lord is in conjunction with Rahu
      and is also under the aspect or conjunction of Mercury, it will denote loss of children
      as a result of the curse of the ''Snake''.

      When the 5th house contains the Sun, Saturn, Mars, Rahu, Mercury, Jupiter and the 5th
      and the Ascendant lords are weak, the childlessness will be ascribed to the curse of
      the ''Snake''.

      Conjunction of the lord of the Ascendant with Rahu and the lord of the 5th house with
      Mars or Jupiter with Rahu, will also effect the destruction of children attributed to
      the curse of the ''Snake''.'
    quote_sha256: 92b4a440d3c93e7b5d4df044f580f1efdd657319d6adf2a561159c55845c4f7a
    authority_tier: S0
    extraction:
