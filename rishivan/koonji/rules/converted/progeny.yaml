      obtaining a son. The consideration of the son is to be made from the Ascendant, the
      Moon, the 7th House and Jupiter. If the 5th House from Jupiter is situated by benefic
      planet, Jupiter himself is together with a benefic planet, the native obtains a son
      and the son is longlived. The same result should be understood from the Ascendant, the
      Moon and the 7th House, that is in the 5th House from these there are placed benefic
      planets and they themselves are together with benefic planets, then any of these combinations
      in the horoscope will bless the native with the obtainment of a son.

      If Mercury, Venus and the Moon are placed in the 5th House the issues will be daughters.
