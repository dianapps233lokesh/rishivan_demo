- id: BPHS.PROGENY.CH85V8105.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.progeny: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch85.v8-105
    quote: 'By non performance of Shradha of the parents (previous birth) that gets into an
      evil spirit (soul) and with the curse of this spirit, there will be deprivation of children.
      Yogas of these kinds in relation to the Ascendant are described over here. If Saturn
      and the Sun are posited in the 5th house, the weak Moon in the 7th house and Rahu and
      Jupiter being in the Ascendant and in the 12th house respectively, the curse of evil
      spirit will destroy the children. When Saturn being, the lord of the 5th house is posited
      in the 8th house and Karaka (Jupiter) is also placed in the 8th house, it will cause
      deprivation of children due to the curse of the evil spirit.

      Positioning of malefic planet in the Ascendant, the Sun being in the 12th house and
      Mars, Saturn, Mercury in the 5th house and the lord of the 5th house is in the 8th house
      will cause destruction of the children as a result of the evil spirit.

      Should Rahu be posited in the Ascendant, Saturn in the 5th house and Jupiter being posited
      in the 8th house, loss of children will be the result owing to the curse of the evil
      spirit.

      If Venus, Jupiter and Rahu are posited in the Ascendant, Saturn is in conjunction with
      the Moon and the lord of the Ascendant is posited in the 8th house, the curse of evil
      spirit will destroy the children.

      If the Karaka (Jupiter) and lord of the 5th house being in the signs of debilitation
      and also aspected by the debilitated planets, it will also cause loss of children. When
      Saturn is in the Ascendant, Rahu in the 5th house, the Sun in the 8th house and Mars
      being in the 12th house, the evil spirit will destroy the children.

      If lord of the 7th house is in a Trik house (6th, 8th, 12th), the Moon is posited in
      the 5th house and Mars and Gulika are in the Ascendant, it will bring about the loss
      of children following the curse of the evil spirit.

      Positioning of the lord of the 8th house, Saturn and Venus in the 5th house and Karaka
      Jupiter being in the 8th house will cause the destruction of the children due to the
      curse of the evil spirit.'
    quote_sha256: dfc3f4171ccd8adbfdb7780acc49be3d6d3b51c9c97577922b8f2e5dfff985ea
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: 85.8_105_rule_1
    review:
      state: unreviewed
