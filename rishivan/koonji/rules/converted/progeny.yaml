- id: BPHS.PROGENY.CH85V7178.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.progeny: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch85.v71-78
    quote: 'The one getting proud and overbearing of ones power, if insults the Brahmins,
      this affliction (दोष) or the curse of the Brahmins destorys the children (The kind of
      pride could be due to excessive property, physical strength, status, wealth etc.)

      If Rahu is posited in the sign of Jupiter, the 5th house contains Jupiter, Mars and
      Saturn and the lord of the 9th house is posited in the 8th house, the children get destroyed
      due to the curse of the Brahmins.

      When the 9th lord is in the 5th house, the lord of the 5th house be in the 8th house
      and gets conjunct with or aspected by Jupiter, Mars, Rahu, it will attribute childlessness
      due the curse of the Brahmins.

      Should the lord of the 9th house get debilitated, the lord of the 12th house is posited
      in the 5th house and either gets conjunct or aspected by Rahu, it will cause loss of
      children as a result of the curse of the Brahmins.

      If Jupiter being debilitated, Rahu is situated in the Ascendant or in the 5th house
      and the lord of the 5th house is in a Trik house (6th, 8th, 12th), it will also denote
      destruction of children following the curse from the Brahmins.

      If Jupiter being the lord of the 5th house and posited in the 8th house duly conjunct
      with the malefic planet or the lord of the 5th house alongwith the Sun and the Moon
      is in the 8th house, there will be loss of children due to the curse of the Brahmins.

      When Jupiter being in the Navaṁsa of Saturn and Saturn conjoins Mars and the lord of
      the 5th house is posited in the 12th house, the Brahmins'' curse destroys the children.

      Should the Ascendant contain''s Jupiter and Saturn and Rahu being in the 9th house or
      Rahu joins Jupiter in the 12th house, even then it will cause deprivation of children.'
    quote_sha256: 1235553fc2ae9f112c654563f1ec0375f5c68c2ae6dec8630715a9d8175e0bde
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: '85.73'
    review:
      state: unreviewed
  when:
    all:
    - occupies_bhava:
        subject: lord.bhava.09
        bhava: bhava.05
    - occupies_bhava:
        subject: lord.bhava.05
        bhava: bhava.08
  indicates:
    claim: progeny.children
    polarity: negative
    magnitude: strong
    text: loss of children due to the curse of the Brahmins
