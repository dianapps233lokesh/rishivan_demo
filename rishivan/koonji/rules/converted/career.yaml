    edition: bphs-gcsharma-vol2
    locator: ch50.v9-13
    quote: >-
      The results of the Dasa of the 10th lord will be auspicious if conjunct with the 5th
      or the 9th lord. The Dasa of the other planets will also be favourable if posited with
      the 5th lord. Conjunction of the 9th lord with the other planets will cause exceedingly
      good results during the Dasa of such planets. The Dasa of the 9th lord if conjoined
      with the 4th lord and the Dasa of the 10th lord if posited in the 5th house are also
      the benefic Dasas. The Dasas of the Trine lords occupying Angles (kendras) position
      or the Angle lords located in the Trine houses, also render good results and these Dasas
      according to the Astrological Savants are said to be extremely auspicious.
    quote_sha256: fc48ffccab6641eaa66bf89687dccb050d543c2d4744eda92cf58f96bf4851b0
