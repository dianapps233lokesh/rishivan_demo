    locator: ch56.v70-73
    quote: >-
      During the Mahadasa of Mars and the Antardasa of the Moon, if the Moon is in the sign
      of exaltation, own sign or in Angles in conjunction with the lords of the 9th, the 4th
      or the 10th house or the Ascendant lord, it will give fragrance, rosary of the flowers
      or clothes; will undertake pious deeds, construction of pond, cow shed etc., will have
      festivity of marriage, happiness from wife and children, co-operation from the parents,
      blessings of Goddess Laxami (wealth), completion of ambitious tasks with the blessings
      of the king etc. If it is full Moon, the result will be total and in case of weak Moon,
      diminishing results will be experienced.
    quote_sha256: c8cb78a5d6b162b6aa1cb959ed0f19a561cf83dc9c0d8be80a339ace5d22bebb
    authority_tier: S0
    extraction:
