    quote: 'Should the 12th Lord occupy the 5th House, the native will be bereft of sons and
      learning. He will spend money and also make pilgrimages to beget a son.

      Notes : According to this rule, the 12th House or the House of Foreign Countries gets
      related to the 5th House, the House of Learning. Therefore, such a native often gets
      education in foreign countries which makes him spend much money. If the 12th Lord is
      weakened he gets education in his own country living in a hostel. We give here two examples
      to illustrate it.

      Date of birth : 5.5.1958

      Time of birth : IST 8.15 P.M.

      Place of birth : Lat. 28°. 43 Long. 77°.55 In this Horoscope of Scorpio Ascendant the
      12th Lord is situated in the 5th House who is exalted there. This native got medical
      education in a foreign country and is now engaged in practice in his native country.
      In this Horoscope the 5th Lord is also situated in the 12th House, the House of foreign
      country. Therefore, both the 5th and the 12th Lords have exchange with each other. Though
      Mercury in the 5th House is in his sign of debilitation, but in the same House the planet
      Venus is in her sign of exaltation and therefore the debilitation of Mercury is broken
      (Neecha Bhanga). The native got the education of engineering in a foreign country and
      then returned to his native country India.

      Date of birth : 11.5.1953

      Time of birth : IST 11.55 P.M.

      Lat, 28°.43'' Long. 77°.55 In this Horoscope also the 12th Lord Jupiter is situated
      in the 5th House in the sign of Taurus. The Fifth Lord Venus is in her sign of exaltation
      in a sign of Jupiter (3rd House). In this combination the special point is that the
      5th Lord and the 5th House should be endowed with strength'
