      from_rule_key: mars_mercury_in_9th_1
    review:
      state: unreviewed
  when:
    all:
    - occupies_bhava:
        subject: graha.mars
        bhava: bhava.09
    - conjunct:
        subject: graha.mars
        other: graha.mercury
  indicates:
    claim: education.learning
    polarity: positive
    magnitude: moderate
    text: the person born will be learned in the sacred books
