    quote: >-
      Sloka 76. If Mars and Mercury be together in the 9th bhava, the person born will be
      learned in the sacred books and devoted to pleasure and ease ; if Mars combine with
      Jupiter in that bhava, the person concerned will be wealthy and respected The effect
      of Mars being associated with Venus in the 9th bhava is that the person born will have
      two wives and will be an ex- pounder of law in a foreign land. If the planet combining
      with Mars in the 9th bhava be Saturn, the influence of the yoga on the person born is
      to make him wicked and addicted to women not his own. When Mercury and Jupiter are found
      together in the 9th bhava, the person born will be keen-witted, wise, wealthy and learned.
