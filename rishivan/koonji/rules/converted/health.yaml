- id: BPHS.HEALTH.CH59V2223.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.health: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch59.v22-23
    quote: 'If Ketu is in the 2nd or the 7th house, there will be physical trouble. Giving
      goat in charity will mitigate the evil effects of premature death and peace and comforts
      will prevail with the blessings of Ketu. Noted : Placement of Ketu in the 3rd house
      will inculcate prowess and endurance in the native and if the lord of the Ascendant
      and the 3rd house conjoin with Ketu, the native acquires lot of fighting strength and
      sustained endurance. A horoscope with such combinations, is presented herewith. Example
      : 51

      Data : Date of birth 14/15-9-1970, Time of birth 1-15 hrs. (IST)

      Latitude 28°-43'' (N); Longitude 77°-55'' (E)

      Balance of Dasa at birth : Rahu, 1 year, 3 months, 20 days. In the birth chart, Ketu
      is situated in the 3rd house duly conjoined with lord of the Ascendant Mercury and Mars.
      Ketu is placed at Trine from Saturn. In the Navamsa chart, Ketu is located at an Angle
      from Saturn. In the main period of Saturn and sub-period of Ketu, the native''s father
      handed over a very big chemical factory to him which made good earnings right from the
      beginning purely on account of sustained efforts put in by the native.'
    quote_sha256: 646a244447e5f33246b0d8d366d12c70b865dce883560fcbeb6b382617290fa6
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: ketu_2_7_physical_trouble
    review:
      state: unreviewed
  when:
    any:
    - occupies_bhava:
        subject: graha.ketu
        bhava: bhava.02
    - occupies_bhava:
        subject: graha.ketu
        bhava: bhava.07
  indicates:
    claim: health.vitality
    polarity: negative
    magnitude: moderate
    text: physical trouble
