    quote: >-
      Placement of Ketu in the Trik houses (6, 8, 12) from the Mahadasa lord or conjoined
      with the malefic planets will manifest impalpable quarrels, destruction of animals and
      crops. If Ketu is in conjunction with the debilitated planet or located in the 6th or
      the 8th house from the Ascendant, there will be coflict with the co-borns; injury or
