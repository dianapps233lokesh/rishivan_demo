- id: PRASNAMARGA.HEALTH.CH16V215.0001
  version: 1.0.0
  status: candidate
  school: school.prashna
  assertion: assert_claim
  domains:
    domain.health: 0.7
  source:
    book: prasna-marga
    edition: prasnamarga-raman-part1
    locator: ch16.v215
    quote: '215


      Stanza 123. — The places signified by the different signs are: Aries — gold and silver
      mines, diamond mines, canals and serpent''s abode. Taurus — all places mentioned for
      Aries and farm houses, fields of cultivation and beautiful spots. Stanza 124. — Gemini
      — parks, places of worship, areas where precious stones abound and pleasure haunts.
      Cancer — neighbourhood of tanks and watery tracts and places where celestial nymphs
      frequent. Stanza 125. — Leo — places frequented by lions and other wild animals, elevated
      places, cowsheds, places frequented by Brahmins and Dcvas, Virgo — temples, horse and
      elephant stables, seacoast and ladies'' apartments. Stanza 126. — Libra — streets, bazaars
      and forests. Scorpio — anthills and ponds. Sagittarius-rest houses, military barracks,
      battlefields and walls and embarkments. Stanza 127. — Capricorn — river deltas, forests,
      areas inhabited by wild tribes; Aquarius — same places as Capricorn; and Pisces — deep
      caves, watery places and temples. Stanza 128. — The twelve signs from Aries onwards
      govern in regular order forests, fields, cities, canals, hills, towns, market places,
      wells, forests, oceans, lakes and rivers. Stanza 129. — If the lord of the 2nd is associated
      with or aspected by the ''lord of harm'', the person suffers disease due to Jihwa Dosha.
      Till now Drishtibadha was discussed. Now the discussion will be centred on Jihwa Dosha
      or evil arising from words. Stanza 130. — There are some Bala grahas which trouble only
      children. Now the important of them such as Puthana, etc., will be elaborated. Stanza
      131. — If either Mercury or Saturn occupies the house of harm or if Gemini or Capricorn
      happens to be the house of harm, then the child suffers from the affliction of Bala
      Grahas. This verse is applicable only in queries bearing on children. Stanza 132. —
      If Gulika or Rahu occupies 4th, 5th, 7th or 8th, the disease is due to poisonous matter
      in the food. If the lord of the 6th joins this combination, then the poisoning will
      be due to enemies. Stanza 133. — The poison will have been administered mixed up with
      a hot substance, ghee, honey, curds, milk and fruits, cooked food or saltish juice according
      as Arudha Lagna happens to fall respectively in the signs of the Sun, Mars, Mercury,
      Venus, Jupiter, Saturn or the Moon. If Arudha Lagna is Leo, the poison has been given
      in some hot substances; if it is Aries or Scorpio, in ghee; Gemini and Virgo stand for
      honey; Taurus and Libra govern curd or buttermilk ; Sagittari us and Pisces stand for
      milk and fruits; Capricorn and Aquarius stand for bread and other cooked food such as
      sweetmeats ; and Cancer stands for saltish foods or liquid substances. Stanza 134. —
      If the lord of Lagna is connected with the lord of 6th, then the object of giving poison
      is to harm the person. If the lord Of Lagna is connected with the lord of 7th, then
      it is intended to win over the person. Stanza 135. — As already detailed, there are
      two types of disease viz., those caused by the disorder of thridoshas and those brought
      about by mantric machinations of enemies which in their turn provoke the thridoshas.
      Now the discussion will relate to satrubadha or troubles from enemies. Stanza 136. —
      If Mercury is stronger, the disease is due to Aabhichara. If Lagna is stronger, the
      disease is due to the disorder of thridoshas. If the lord of the 6th is stronger, the
      disease is due to enemies. If the lord of the 8th is stronger, then the disease is due
      to disturbance in the thridoshas. Stanza 137. — The lords of disease are the rulers
      of the 6th and 8th. If the former is stronger, the disease is due to enemies. If the
      latter is strong, it is due to thridoshas. Stanza 138. — If the lord of the house of
      harm occupies or aspects the 6th; or when the lord of the 6th joins or aspects the house
      of lord of harm; or when these interchange houses; or occupy the same house ; or when
      these aspect each other, it should be inferred that the afflictions come front) the
      enemies. The disease or affliction will be due to enemies under the following conditions:
      (1) Lord of house of harm ocupies the 6th; (2) lord of house of harm aspects the 6th;
      (3) lord of 6th joins the house of lord of harm ; (4) lord of 6th aspects the house
      of lord of harm ; (5) lords of 6th and bouse of harm interchange ; (6) lords of the
      6th and house of harm are together ; and (7) when the lord of the 6th aspects the lord
      of the house of harm. Stanza 139. — The affliction is of two kinds : If the lord of
      house of harm is a benefic, it is mahabhichara. If the lord is a malefic, it is kshudrabhichara.
      Stanza 140. — Mahabhichara consists of incantations calculated to cause death, etc.
      Kshudrabhichara consists of burying enchanted substances underground to bring about
      ruin. Stanza 141. — When it is discovered that there is Aabhichara, we have to find
      who the enemy is and who did the work for him. The caste to which such persons belong
      is explained in the next verse. Stanza 142. — The caste and occupation governed by the
      6th house or by its lord indicate the caste of the enemy. Similarly, the caste governed
      by the ''house of harm'' or its lord is the caste of his accomplice. Pisces, Aries,
      Taurus and Gemini and their trines signify respectively Brahmins, Kshatriyas, Vaisyas
      and Sudras. Stanza 143. — If the lord of the house of harm is in any way connected with
      the 6th house, then the enemy''s caste is that of the sixth house. Stanza 144. — If
      the lord of the house of harm is in any way connected with the lord of 6th, the enemy''s
      caste is that of the lord of the 6th. Stanza 145. — If the lord of the 6th is bound
      up with the house of harm, then the accomplice in the deed belongs to the caste governed
      by the house of harm. Stanza 146. — If the lord of the 6th is bound up with the lord
      of the house of harm, then the accomplice belongs to the caste of the lord of the house
      of harm. Stanza 147. — According to Varahamihira, Jupiter and Venus are Brahmins, the
      Sun and Mars — Kshatriyas, the Moon — Vysya, Mercury — Sudra and Saturn — mixed caste.
      Stanza 148. — According to others, Jupitor is an exalted Brahmin while Venus is an ordinary
      Brahmin. When these join other planets, their qualities change. The Sun is the emperor,
      while Mars governs kingship. Shanza 149. — Mars also signifies distinguished persons
      with no sacred thead, Mercury governs learned men and temple servents with no saered
      thread. Stanza 150. — Saturn in exaltation rules over temples employees while irt debilitation
      he rules over low-caste people. Stanza 151. — Mahvacharya says that Jupitor and Venus
      represent Brahmins: the Sun and Mars, Kshatriyas ; the Moon, Vaisyas; Mercury, Sudras;
      and Saturn, low cast people. Stanza 152. — \ccording to Krishneeya, Jupitor and Venus
      govern Brahmins, the Sun and Mars Kshatriyas, the Moon and Mercury Vaisyas ; and Saturn
      Sudras and the mixed caste. Stanza 153, — In Sarasamuchaya, it is said that the Sun
      and Venus govern kings of all 218

      castes, the Moon governs Brahmins or Vaisyas, Mars governs Brahmins and Sudras. Stanza
      154. — Mercury governs Vaisyas and Sudras, Saturn governs Sudras and low caste people.
      Jupiter governs Brahmins and Venus Brahmins, Sudras and women. When these planets are
      in inimical places debilitation or combustion, they govern only very low types Stanza
      155. — With regard to the enemy''s caste, there are other views by which it can be determined.
      Stanza 156. — The caste of the enemy is signified by the lord of the 6th, and the lord
      of the 10th signifies the caste of the accomplice. The motive for Abhichara Karma corresponds
      with the nature of the lord of the sign occupied by the lord of the 6th. Stanza 157.
      — According as the lord of the 6th occupies the sign of Mars, Mercury, Jupiter, Venus,
      Saturn, the Moon or the Sun, the motive behind the deed happens to be lands, gold, fruits,
      silver, clothes, cattle or grain, servants, low caste people and weapons, vessels or
      water, or roots and fruits. Stanza 158. — The motive of the enemy in resorting to Abhichara
      can also be gleaned according to the nature of the house occupied by the lord of house
      of harm. The view adumbrated in this Stan/a is from ''other works''. The house containing
      the lord of house of barm reveals the motive behind the Abhichara. Thus if the lord
      of harm is in the 2nd, the motive is money: if in the 4th, property is the motive. In
      this way, the motive should be ascertained. Stanza 159. — Whether the motive behind
      the enemy''s deeds springs up from Dhatu, Moola or Jeeva, can be ascertained by examining
      the rising sign, planets in the rising sign, lord of the sixth, lord of the house of
      harm, the house occupied by the lord of sixth, the sign occupied by lord of Lagna. Whether
      the enemy belongs to the same family as the querist or to outside family or whether
      the enemy is a near or a distant relative, should be carefully ascertained by noting
      the Lagna. Stanza 160. — If the Lagna is a movable sign, the enemy is of the same kith
      and kin; if a fixed sign he is related; if common, the enemy is an outsider. According
      as the 6th house is occupied by the lord of the 4th, 5th, 7tb, 9th, the enemy who is
      the cause of trouble will be a relative, son, wife or father or preceptor. Stanza 161.
      — If the Lagna is a fixed sign, the enemy is a sahavasi (lives with the native); if
      it is a common sign, he is a neighbour; and if movable, the enemy belongs to a distant
      place, or is an old friend. Stanza 162. — The direction and caste of the enemy and how
      far or near he is, should be ascertained from the 6th house or its lord. Similarly,
      the direction and caste of the mantric and how far or near he is, should be read from
      the Badhaka house or its lord. NOTES

      Whether it is the 6th lord or 6th house and whether ft is the badhaka house or its lord,
      should be ascertained on the basis of Stanza 140 to 143. The directions and castes allotted
      to different Rasis are: If the Rasi and Navamsa in which the 6th house falls, or the
      6th lord occupies are movable, the enemy or mantric will be far off; if fixed, near;
      if common, not too far and not too near. If the said Rasi and Navamsa are different,
      then, the stronger of the two should be taken. Stanza 163. — If the Ascendant happens
      to be a movable sign with Mars in the 11th, or a 220 fixed sign with Mars in the 9th,
      or a common sign with Mars in the 7th and is aspected by the lord of the 6th, the native
      has sickness through Abhichara resorted to by an enemy. Stanzas 164 to 167. — The cause
      of sickness will be Abhichara under the following combinations. Mars in the Ascendant
      or in a quadrangular house and the lord of the 6th is in the rising sign; lord of the
      6th in the Ascendant, 7th or 10th and Mars in or aspecting the Lagna; Ketu in the 4th,
      10th or Ascendant and Mars in or aspecting Lagna; and Ketu in the 4th, 10th or Ascendant
      and Mandi occupying a kendra. Stanzas 163 to 167 are from Santhana Deepika. These stanzas
      give combinations to predict on the basis of the Prasna Chart, the source of sickness.
      The stanzas are easy to understand and do not need detailed elucidation. However, I
      should like to make a few observations. In all the combinations listed, importance is
      given to the 6th lord. According to Stanza 163, the 6th lord should aspect the Ascendant
      which should have Mars placed in the 11th, 9th or 7th. according as the ascending sign
      is movable, fixed or common. Stanzas 164 to 167 also require a certain disposition of
      Mars, Ketu or Gulika and the 6th lord involving only the Ascendant and the other quadrangular
      houses. Stanza 168. — To bring about death, exile, dissensions, madness, or ruin, marana
      and uchhatana — enemies prepare powders and other enchanted things and conceal them
      under the earth or in some hidden places. The astrologer will have to inform the client
      where these can be found, so that they can be removed. Stanza 169. — If Gulika occupies
      a quadrant from Lagna or Arudha Lagna or the Moon and is joined or aspected by Saturn,
      then the incanted articles (Kshudras) will be kept buried under the earth. Stanza 170.
      — If Mandi is in the 4th house or Navamsa, then the Kshudra will have been deposited
      inside the house. If the 4th house or Navamsa is watery, it will be kept immersed under
      water. Here the situation of Mandi in the 4th is with reference to Lagna, Arudha or
      the Moon. According to some,

      Mandi — whatever Bhava he may occupy — if it is a watery Rasi or Navamsa, the place
      of deposit shall be under water. Stanza 171. — If Mandi is in Vargottama, the Kshudra
      will be in two places — within the house and under water. If Rahu joins Mandi or Saturn,
      the substance is hidden near an ant hill. Stanza 172. — According as a kendra (from
      Mandi or Saturn) is occupied by the Sun. Mars, Jupiter or Venus, the Kshudra is kept
      respectively in the branches of trees, in open fields, in the house itself or in the
      bedroom. Stanzas 173 to 176. — If Saturn is in a kendra from Mandi, the Kshudra ''Will
      be kept in latrines and urinals. According as Mandi is in Aries, Taurus, Gemini or Cancer
      (or their trines), the Kshndra will be kept in the skins of tigers and cats, water pots,
      bamboo vessels or cocoanut shells respectively. If Mandi is in Samhara Nakshatras (destructive
      asterisms), the Kshudra will be in the form of an image of a human. If Mandi is in Scorpio,
      it is in the form of an amulet. If it occupies the Navamsas of quadrupeds, it is in
      the form of bones. The number so kept or buried can be known from the expired number
      of Navamsa in the Rasi occupied by Gulika. NOTES Samhara Nakshatras are Krittika and
      Aridra. From the description of the methods for finding the nature and source of sickness
      given in these stanzas, it is clear that at the time the author lived, the practice
      of causing barm through incantations, spells and other forms of base practices was widespread
      in Kerala. Even now not only in Kerala but also in other parts of India, resort is being
      bad to such methods to cause harm to one''s enemies. Some of the Kerala astrologers
      whom I had discussions with, say that these astrological principles pertaining to discovery
      of abhichara given in this work are almost always foolproof and that even now people
      consult astrologers on these lines. The number of articles (Kshudras) on which the spell
      in cast corresponds to the number of Navamsas gained by Mandi in the Rasi be occupies.
      According to some, the total number of Navamsas from the beginning of Aries Navamsa
      should be considered. If for example, Mandi is in Libra Navamsa (Cancer sign) according
      to the first view, the number will be the 4, 3 Navamsas having completed. According
      to the others, the number will be 7, couating from Aries. Here again the figure has
      to be doubled if the amsa lord is exalted, etc. Stanzas 177 to 180. — If the lord of
      harm occupies Urdhwamukha Rasi, then the ''charm'' has been placed on the tops of trees;
      if it is Adho-mukha Rasi, it is under the earth; if it is Thiryangmukha, it is kept
      inside stones or logs of woods etc. By examining the Ras( held by the Badhaka, the family
      to which the trecis wherein the Kshudra is deposited belongs should be known. If the
      Rasi is that of a benefic, the tree also belongs to a good family; if not the reverse.
      Count from the Navamsa owned by lord of Badhaka to the Navamsa occupied by him. This
      number gives the trees that grow there. Similarly is to be ascertained whether the Kshudra
      is in a particular tree or near a tree, etc. The nature of the tree can also be learnt
      from the Navamsa, as for example, Aries indicates a tree with thorns, Taurus a tree
      with flowers and Gemini a tree without fruits and so on. Stanza 181. — If the sign occupied
      by the lord of the house of harm is watery and it also happens to be Urdhwamukha, then
      the charm is kept on the bank of ariver or a lake; if Adhomukha, buried under the waters;
      and if Thiryangmukha, has been allowed to float in the waters. Stanzas 182 to 185. —
      The Kshudra will be found to have been buried respectively near temples; watery tracts
      or places where springs sprout; burial grounds, battle fields or fiery places; places
      of learning or amusement; treasure-

      houses or state boundaries; village boundaries or bed-rooms; and dirty or deserted places,
      according as the Sun, the Moon, Mars, Jupiter, Venus or Saturn happens to be either
      lord of house of harm or occupies the house of harm. Stanza 186 & 187. — If the lord
      of harm is conjoined with Rahu, Ketu or Gulika, then it has been kept in the serpent''s
      abode or its vicinity. The direction where the Kshudra is kept should be ascertained
      from the lord of 6, lord of house of harm or lord of the Rasi and Navamsa occupied by
      the Badhaka lord. If the lord of harm is in a movable sign, the Kshudra can be easily
      removed; if he is in a common sign, it can be taken out with effort; and if he is in
      a fixed sign, it cannot be removed at all. Stanza 188. — Having ascertained the Kshudra,
      its location and whether it can be removed, the effects should be destroyed according
      to sastraic injunctions. I shall now describe the remedies for Mahabhichara. Stanza
      189 to 191. — According as the Rasi arrived at by adding the longitudes of the lords
      of the Ascendant and the 6th, is conjoined with or aspected by the Sun. the Moon, Mercury,
      Jupiter or Saturn, Mars or Venus, the remedial measures to be resorted to are respectively
      Aghorabali, Kapala Homa, Chakra Homa, Prathikarabali, Bhuthamaranabali or Khanga Ravanabali
      or Krittikabali, or Prathikara or Bhuthamaranabali. I do not propose to explain in detail''
      these remedial measures. There arc even now experts in this subject and they may be
