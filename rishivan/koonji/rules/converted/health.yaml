    quote: '12 Pisces.—The Moon and Mars are auspicious. Mars is most powerful. Mars with
      the Moon or Jupiter causes Rajayoga. Saturn, Venus, the Sun and Mercury are evil. Mars
      himself does not kill the person even if he is a Maraka. A

      S soon as the heavenly map is cast and the

      ruling planet, constellation and the balance

      of the dasa period are decided, the next step

      would be to find out the probable results of the

      ascendant or lagna falling in any of the 12 signs.

      This gives us a clue to the determination of one''s

      physical features, stature, marital disposition and

      other peculiarities. The following details are only general in

      nature and should not be applied hastily. The

      strength of the rising sign, its ruler, the planets

      aspecting the ascendant, the peculiarities attend-

      ing on the ascendant and its lord both in rasi and

      navamsa should be carefully considered before

      any predictions could be definitely ventured. Aries.—Persons born in Aries will have
      a

      certain amount of independent thinking and

      reasoning faculty. They will be capable. They

      will not be slaves to laws of convention or those

      arbitrarily established. They are lovers of scienti-

      fic thought and philosophy ; have their own ideas

      of right and wrong and are strongly bent upon 138 educational pursuits. As the Ram is
      ruling them, they are rather stubborn but often frank, impulsive and courageous. They
      are more gossippers than practical men. They sometimes require a certain amount of cajolery
      and sycophancy to raise them to action. They will become pioneers. As Mars is the lord
      of Aries they will be martial in spirit. Their constitution will be hot, and they are
      occasionally subject to hot complaints, piles and the like and must avoid enterprises
      obviously involving any serious risks. They love beauty, art and elegance. The diseases
      they suffer from will be mostly those of the head and unpleasant sight-seeing may often
      lead to mental affliction and derangement of brain. Their build will be slender and
      females generally possess fairly perfect contours. Taurus.--The stature of the persons
      born in this sign will be short and often corpulent, lips thick, complexion swarthy.
      They generally resemble the bull in their behaviour towards new people if they are not
      listened to properly. They will have their own principles and ways, and a piercing intellect.
      They shine well as authors and journalists. They are not bound by sentimentality but
      appreciate truth. They are remarkable for their ability to commit to memory. Their physical
      and mental endurance are indeed noteworthy. They have much business knack and surpassing
      intuition. They often think they are born to exercise authority over others and in a
      sense they are right. They are sensitive to physical influences. They are often liable
      to extremes, zealous, and easily accessible to adulation. They generally suffer from
      nervous complaints after their fiftieth year but their memory and powers of imagination
      will never deceive them. They are slow to anger, but when provoked furious like the
      bull. They are passionate and many become preys to sexual diseases in their old age.
      Gemini.—Person born when Gemini is rising will have a wavering mind, often tall and
      straight in nature and active in motion, forehead broad, eyes clear and nose a bit snubbed.
      They are very active and become experts in mechanical sciences provided Saturn has some
      strong influence over them. They will be "a jack of all trades but master of none".
      They are vivacious, but liable to be inconstant: They will have sudden nervous breakdowns
      and must exercise a certain amount of caution in moving with the opposite sex ; a habit
      of self-control must be cultivated. Their mind wil! be often conscious of their own
      depravity. They are liable to fraud and deception. If evil planets are found in Gemini,
      trickery and deceit will characterise their nature. Cancer.—Persons born under Cancer
      will have a middle-sized ''body, face full, nose snub-bed to some extent and complexion
      white. They are very intelligent, bright and extremely frugal and equally industrious.
      Their frugality often takes the form of miserliness sympathy, and cowardice. They will
      be much attached to their children and family. Their extreme sensitiveness renders them
      nervous and queer. Their minds will be bent upon schemes of trade and manufacture. They
      often meet with disappointments in love affairs. They are very talkative, self-reliant,
      honest and unbending. They will have reputation as lovers of justice and fairplay. Leo.—Persons
      born under Leo will be majestic in appearance, broad shoulders, billous constitution
      and bold and respectful in temperament. They possess the knack to adapt themselves to
      any condition of life. They are rather ambitious and sometimes avaricious too. They
      are independent thinkers. They stick up to orthodoxical principles in religion but are
      perfectly tolerant towards others'' precepts and practices. They are lovers of fine
      arts and literature and possess a certain amount of philosophical knowledge. They are
      voracious readers. In life they do not succeed in the end as they expect, and often
      throughout their life they struggle very much for success. Their ambitions remain unfulfilled
      to a great extent. They get into many difficulties because they lack a natural policy.
      Virgo.—People born when Kanya or Virgo is rising will exhibit their intelligence and
      memory when quite young. They will be middle-sized persons and exhibit taste in art
      and literature. Their chest will be prominent and when afflicted very weak also. They
      are discriminating and emotional and are carried away by impulses. As authors they make
      real progress especially in Bhouthika Sastras and Rasayana Sastras (Physical and Chemical
      Sciences) and can judge things at a glance. They love music and fine arts and acquire
      much power and influence over other 142 people. They are liable to suffer from nervous
      breakdowns and paralysis when the sign is afflicted. Libra.—The complexion of persons
      born in this sign will be fair, their stature middle-sized, face broad, eyes fine, chest
      broad and light, appearance handsome, constitution rather phlegmatic, sensual disposition
      and keen observation. They have a keen foresight and reason out things from the standpoint
      of their own views. Firm in conviction and unmoved by mean motives they are somewhat
      susceptible to the feelings of others'' minds. They are more idealists than realists
      or practical men and often contemplate upon schemes like building castles in the air.
      They are not sensitive to what others say of them. But as political leaders and religious
      reformers they exert tremendous influences over the masses and sometimes their zeal
      and enthusiasm go to such a high pitch that they force their views upon others of opposite
      thought not realising the baneful after-effects of such a procedure. They love excitement
      and will have the power of intuition which they more rely upon for their own guidance.
      They are not easily amenable to reason 143 and they are great lovers of music. They
      have a special liking for truth and honesty and do not hesitate to sacrifice even their
      lives at the altars of freedom and fairplay. Scorpio.—Those born under this sign will
      have youthful appearance, a generous disposition and fierce eyes. They are exceedingly
      fickle-minded and love much excitement. They are inclined to sensual things in reality
      while they won''t hesitate to philosophise upon the merits of controlling sensual pleasures.
      Even females born in this sign will have more of masculine tendencies. They are good
      correspondents and invite friendship from among people throughout the world. They will
      become expert musicians if they care to practise that art. They are proficient in fine
      arts, dancing and the like and no doubt they have a philosophic disposition. They set
      at naught conventional habits and customs. They vehemently uphold their own views but
      nevertheless will not clash with those holding opposite ones. Their constitution will
      be hot and they are liable to suffer from piles and venereal complaints after their
      30th year. They are silent and dignified and never speak before weighing each and every
      word. They are good conversationalists as well as writers and often rely too much on
      their own intelligence. Sagittarius.--Jupiter rules this sign and persons born under
      this sign will generally be corpulent. They possess almond eyes and their hair is brown.
      They are of a phlegmatic temperament. They are too conventional and sometimes businesslike
      also. They are prompt and uphold orthodox views. They will be attracted towards the
      study of occult philosophy and sciences. In these departments of knowledge they will
      really acquire a great mastery in a short time. They are too callous and enthusiastic.
      They hate all external show. They are God-fearing, honest, humble and free from hypocrisy.
      They never think of schemes which are calculated to disturb the progress of others.
      They will exercise strict control over their food and drinks and in regard to their
      relationship with the opposite sex. They are brilliant, their manners affable, winning
      and hearts pure. They are prone to be misunderstood unintentionally by others on account
      of their hastiness in conversation. In their later years they must be careful about
      their lungs as they are liable to suffer from rheumatic pains and the like. Capricorn.—Persons
      born in this sign will be tall, reddish-brown in colour with prominent stiff hair on
      the eye-brows and the chest. They have large teeth sometimes protruding outside the
      lips and presenting an uncouth appearance. They have a knack to adapt themselves to
      circumstances and environments. They have great aspirations in life and cannot economise
      funds even if they were to be under the influence of adversity. They are modest, liberal,
      gentlemanly in business transactions. They are noted for their perseverance and strong-mindedness.
      In fact they are stoical to the miseries of life. They are possessed of sympathy, generosity
      and philanthropy and take a great interest in literature, science and education. Sometimes
      they are vindictive, when Saturn is badly posited. They are possessed of an invincible
      bigotry before which sober counsels will be of no avail. Aquarius.—This "Water Bearer"
      sign in which the birth of an individual is condemned, as the birth lord becomes the
      lord of the house of loss, has to its credit some of the greatest philosophers and seers.
      Those born under this sign will be tall, lean, countenance, handsome, manners winning,
      appearance attractive, disposition elegant. Their lips are flushy, cheeks broad with
      prominent temples and buttocks. They are highly intelligent and make friends of others
      very soon. They are peevish and when provoked rise like a bulldog but their anger is
      very soon subsided. They are pure in heart and always inclined to help others. They
      shine very well as writers and are good spokesmen. They are timid, funky and at times
      cowardly also. They feel shy to exhibit their talents before new audience but their
      conversation will be most interesting and highly instructive. They will specialise in
      subjects like astrology. Their literary greatness will come before the world when they
      are quite young and they themselves will not be able to estimate their capacities well,
      while others find in them something remarkable and extraordinary. They are intuitive
      and good judges of character. They have no organising capacity and are capable of acquiring
      very fine education. They will be much devoted to their husbands or wives and never
      betray the interests of even their enemies, when trust is placed in them. They are liable
      to suffer from colic troubles and must take special precautions to safeguard themselves
      against diseases incidental to exposure to cold weather. On the whole, Aquarius people
      have something subtle in them which endears them to all they come in contact with. Pisces.--Persons
      born in this sign will be fair, stout, of middle-sized height. They are very reserved
      in their manners and are liable to draw premature conclusions on any matter. They are
      God-fearing. They are extremely superstitious and religious, very rigid in the observance
      of orthodoxical principles and can forego anything but their orthodoxy. They are stubborn,
      rather timid, and ambitious to exercise authority over others. They are true friends
      and are proud of their educational and other attainments. If the lord of the 7th is
      badly afflicted, they will have double marriage. They are restless and fond of history,
      antiquarian talks and mythological masterpieces. They are frugal in spending money and
      though generally dependent upon others throughout their life still bear a mark of independence.
      They are just in their dealings and fear to transgress the laws of truth. With all this,
      they lack self-confidence. THE twelve bhavas or houses represent the entire history
      of the individual. By a careful scrutiny of the planetary combinations and aspects in
      the twelve houses, the whole life of the person can be predicted with sufficient accuracy.
      The combinations given below are not chosen at random but are the resultant of much
      experience.


      They are chosen from a study of the horoscopes of persons of various ranks and eminences
      and have been gathered from the best and the most standard works on Hindu astrology.
      In applying these rules to practical horoscopes the student must definitely bear in
      mind that they are merely for his guidance. In addition to this, he must also exercise
      discretion and commonsense coupled with, of course, a certain amount of intuition. For
      instance, the astrological principles say that if the 4th house is occupied by benefics
      and its lord well situated, the native gets high education. This is quite sufficient
      for an intelligent student to anticipate certain other things not mentioned here. In
      fact they strike themselves to the student. In a horoscope a benefic may be found in
      the 4th—which may be its house of exaltation, debilitation, or enmity or a friend''s
      sign. Even though a benefic may be in the 4th, the results it gives apparently vary
      according to its disposition towards the lord of that sign. If Jupiter is in exaltation
      in the 4th house, religious learning may be predicted. If he is in debilitation in the
      4th house, the kind of education must necessarily differ. Still in both cases, it is
      Jupiter that occupies the 4th house. Similarly with regard to other combinations one
      must consider all these problems carefully and then venture a prediction. The relations
      and interrelations of planetary vibrations must be carefully scrutinised and then predictions
      ventured. First Bhava (House).—The first house represents the beginning of life, childhood,
      health, environment, personality, the physical body and the character. If the lord of
      the birth house or 1st house is exalted, well associated, occupies quadrants, has the
      aspects of good planets, the man will have health, majestic appearance, great command
      and happiness. 150 If the lord of the birth is in conjunction with an evil planet and
      occupies the 8th house the health will suffer. If the birth lord is in .conjunction
      with the lord of 6, 8 and 12, the body will suffer from constant complaints. If the
      lord of birth is in 6th, 8th or 12th, the native has sickly constitution. If the birth
      lord is conjoined with an evil planet, and Rahu or Saturn occupies the lagna, the person
      fears from deception from thieves and swindlers. Urinary and bladder troubles and swelling
      of testicles must be foretold if Rahu, Mars and Saturn are in the lagna. The body of
      the native will be emaciated if lagna is occupied by planets like Mars, the Sun and
      Saturn. Birth in watery signs makes the person corpulent. Asthma and consumption, the
      native suffers from if the Sun (Ravi) is in the lagna and Mars aspects him. 151 Many
      evil planets in the birth always indicate misery to the person. Venus in the first half
      of the lagna makes the person happy in the beginning. Venus in the second half with
      evil planets in the 4th and 5th houses makes the person miserable in the end. Second
      Bhava (House).--Second house represents family, face, speech, right eye, food, wealth,
      literary gift, manner and source of death, self-acquisition and optimism. If the lord
      of the 2nd is exalted and is aspected by Jupiter, the native will be a man of considerable
      wealth. If the lord of the 2nd is exalted and quadrants are aspected by benefics, the
      eye-sight will be excellent and the facial expression majestic. A man becomes an orator
      and wealthy also if Jupiter is with the lord of the second or the latter is aspected
      by Mercury, or Venus occupies favourable positions. Poverty will attack the native if
      the lord of the second is debilitated or aspected by malefics. If the lord of the 5th
      is in the quadrants aspected by malefics, the person will look ugly and grotesque. If
      the lord of the second is a watery planet and combines with or is aspected by the lord
      of the navamsa of the 2nd house lord and if the ascendant falls in a watery sign the
      person will be an international trader and the source of his income will be mostly from
      beyond the confines of his motherland. Defective speech should be predicted if malefics
      are with the lord of the second or aspect it. Mercury in quadrant and the lord of second
      powerfully situated, the native becomes proficient in occult sciences especially astrology.
      Confiscation of the property by Government should be predicted if the ascendant is weak
      and its lord joins malefics and the lord of the 2nd is in conjunction with the Sun in
      the 12th house. Fines are levied upon if the lord of the 12th joins the 2nd and the
      lord of the 11th joins the 12th with lord of the 2nd in the 6th, 8th or 12th. Loss of
      wealth by thieves and rulers can be foretold if the lord of the 2nd is aspected by or
      combined with Mars in debilitation or in cruel navamsa. The occupation of the 2nd by
      malefics indicates that the person becomes showy and the period must be predicted under
      the dasas of such planets. If the Sapthamasthana (7th house) is occupied by the lord
      of the 10th and has the beneficial aspects of Jupiter and Venus, the native approximately
      earns at least two to three thousand rupees during such pereods. If the lord of the
      birth is in 2nd and lord of the 2nd is in 11 with the lord of 11 in 1, the native comes
      in touch with hidden treasures. If the lord of the 2nd is debilitated and is in conjunction
      with evil planets, the person contracts hopeless debts. Third Bhava (House).—The third
      house represents brothers and sisters and intelligence, short journeys, neighbours,
      immediate relations and letters and writings. If a malefic planet is in the 3rd or the
      3rd is between two evil planets, all the brothers of the person will die. If the lord
      of the 3rd or Mars occupies 8, 6 and 12 and has no beneficial aspects, prosperity to
      brothers is rarely to be predicted. If the lord of 3 occupies a beneficial navamsa and
      Mars is well posited, the native will be very courageous and will have thriving brothers.
      If the lord of 3 is in 12 and is aspected by evil planets, the person will be funky
      and henpecked. If the lord of 3 is in conjunction with the Sun, the native will be bold
      in mind, and stubborn and angry. The number of brothers may be determined by the navamsa
      the 3rd house falls in or by the number of the navamsa the lord of the 3rd or the karaka
      for the brothers falls in. Fourth Bhava (House).--Peace of mind and happiness, mother,
      home life, relatives, house, self-prosperity, enjoyments, conveyances, landed properties,
      ancestral property, general happiness, 155 education, vehicles and the general build
      of the neck and shoulders. If the lord of the 4th is with the lord of the 1st occupying
      a good place or if the 4th lord occupies trines or quadrants, the person possesses many
      houses. If the lord of 4 is with powerful Jupiter and Mercury and occupies quadrants,
      the person will have an aristocratic disposition and commands many conveyances. If the
      lord of 9 is in quadrants and the lord of 4 well situated, the person will have an excellent
      taste for artistic furniture. If Mercury is in 3, the lord of 4 is well placed, the
      person commands splendid mansions. If the lord of 4 occupies the 12th, loss of ancestral
      property is to be predicted. If the 4th is occupied by Saturn with the Moon in exaltation
      and Jupiter aspecting it, the person will be an author in his early age and have much
      education and the mother dies early. If the lords of ascendant and the 4th are in 11
      and the lord of 2 is in 12 with the Sun, the person possesses limited education and
      good landed property. Jupiter in exaltation in the 4th house and the lord of the 4th
      in his own sign makes the person get high legal education. If lagna is Sagittarius and
      its lord and Saturn are in the same house, the person will rise in education to the
      dignity of a Barrister-at-Law or even more. If Venus or the Moon occupies the 4th without
      any aspects from any malefics, the person will be a voracious eater. If the lord of
      4 is debilitated and joins evil planets, the native becomes extremely sinful as well
      as licentious. If the Moon and Venus are in quadrants occupying evil navamsas and aspected
      by or joined with evil planets, one becomes guilty of improper relations with his mother
      or step-mother. If the lord of 4 is badly situated and is aspected by malefics, the
      person commits adultery with aunts—paternal and maternal. If the Moon occupies birth
      with Rahu or Kethu, the mother will be fond of low men. Saturn in conjunction with the
      lord of 4 or with the Moon will kill the mother early. The person becomes dishonest
      and indulges in fraudulent schemes if the 4th is combined with Saturn, Rahu and Kethu.
      Fifth Bhava (House).—Intelligence of father, discriminating power, children, intelligence,
      fame and position should be predicted from the 5th house. If the lord of 5 occupies
      3, 6 or 12 and is aspected by malefics his children die early. If the Sun is in the
      5th house and is badly placed the father will die. If the lord of the 5th house joins
      favourable planets, the person gets many issues. If Jupiter becomes lord of the 5th
      and being all powerful aspected by the lord of the birth, the person will certainly
      have children. If 5 as well as its lord are placed between evil planets and Jupiter,
      is in company with malefics there will be loss of children. If all the malefics occupy
      4 or if all of them occupy 12, 5, 8 and 1, the person''s family becomes completely extinct.
      The person will have a piercing intellect if the 5th house is between beneficial planets.
      If Saturn is in 5, or aspects the lord of birth or Jupiter, there will be brain derangement.
      If Mercury and Saturn have major influence on the child at birth, the child born will
      be impotent. If the 5th house falls in a sign of Mercury or Saturn and its lord combines
      with Saturn, the person will have an adopted son. If the lord of the 5th is masculine,
      joins a masculine sign, and combines in a masculine navamsa, the first-born child to
      the native will be a male. If the lord of 5 joins a female sign with a feminine planet
      and combines in a feminine navamsa, the first born baby will be a female. Sixth Bhava
      (House).--Represents enemies, thieves, cuts and wounds in the body, disappointments,
      miseries, sorrows, debts, illness, and diseases. Two or more malefics in 6 make the
      native a prey to complicated diseases and a malefic aspect will practically confine
      the person to bed. If the lord of 6 occupies 1 or 8 with evil associations and with
      no beneficial aspects, the native will have many sores. If the Moon, Mercury and the
      lord of birth combine with the Sun, who is with Rahu, the person will suffer from syphilis.
      If Mars joins these, disease will result. If the lords of birth and 6th are in conjunction
      with the Moon, water accidents occur, and if Mars joins the birth lord, danger in battles
      is indicated. If the lord of the 6th and birth conjoin Saturn and occupy quadrants and
      trines, the native will undergo imprisonment. If Saturn is in the 9th, Jupiter in 3rd
      and the Moon in the 7th or 8th, the person''s hands will be cut off by the State. If
      the 10th house is occupied by Rahu, Saturn and Mercury, the native''s hands will be
      cut off. Venus in conjunction with the lord of the 6th, and Saturn or the Sun with Rahu
      in cruel amsas, indicate that the person''s head will be cut off. When the Moon occupies
      the 6th, 8th or 12th aspected by the lord of lagna and conjoined with Saturn and Rahu,
      the person dies by accident or receives serious accidents. If the lord of the 6th or
      8th or Mars joins the lord of the 3rd, and Saturn and Rahu are in cruel navamsas, the
      person dies in a battle or fight. The mutual aspects of Mars and the Sun will kill a
      person in a duel. If the lord of the 6th be a malefic and joins Mercury, who is in debilitation,
      the person suffers from tooth-ache early in his life. Mercury in the 6th debilitated,
      with Saturn and Mars, will render the person an invalid throughout life. If the lord
      of the ascendant joins the 6th aspected by the lord of the 6th, the person will suffer
      much from the machinations of his cousins. If the lord of the 9th joins the 6th aspected
      by the lord of the 6th, and lord of the 6th possesses the conjunction of Saturn and
      Mars, the person will suffer from fires, thieves and swindlers. Seventh Bhava (House).--Represents
      wife, husband, marriage, urinary organs, marital happiness, general prosperity, sexual
      diseases, trade and speculation, diplomacy and honour in foreign lands, source and manner
      of death, business tact and the latent energies and the extent of general happiness.
      If the lords of the 2nd and the 6th have evil conjunctions and occupy the 6th house
      or if the lord of the 7th joins the birth, the moral character of the person will be
      undoubtedly loose. If the lord of the 7th joins Rahu or Kethu and aspects Mars or Saturn
      and Venus is ill-placed one becomes immoral in his early years. If evil planets occupy
      1 and 6 the person will be licentious and indulges in obscure debauchery. If the weak
      Moon joins a malefic in the 7th, the person becomes decidedly immoral. Similarly if
      Venus combines with the lord of the 2nd, 7th and 6th and occupies the ascendant the
      native''s moral character will be loose. Venus in the 7th makes the person extremely
      passionate. Mercury with Venus in the 7th makes the native hunt after other women. Mars
      with Mercury and Venus in the 7th aspected by no benefics render the person extremely
      passionate and make him choose unnatural sources of sense gratification. Jupiter in
      the 7th with no malefic aspects will make the person principled and chaste in sexual
      matters. If the lord of 5 is in 7 and the lord of 7 is with malefics and Venus is weak,
      the wife dies during pregnancy. If the lords of the 2nd and 7th are in their own houses,
      the person will have only one wife. If the lord of the 7th is powerfully exalted and
      occupies birth, more than one wife must not be predicted. If the 7th falls in an evil
      sign, if the lord of the 7th joins debilitation, two marriages must be indicated. 163
      If the lord of 7th and 12th is Venus and he occupies the 9th aspected by Saturn, the
      person will have more than one wife. If the lord of 7th is in the 6th aspected by Rahu
      and with no beneficial conjunctions two marriages should be predicted. If the lords
      of the 7th and 10th exchange their houses and the lord of the 2nd occupies a beneficial
      navamsa, the person will have all marital happiness. If the Sun is in 7th there will
      be intercourse with barren women. If the Moon is in 7th debilitated, intercourse takes
      place with maids of low classes. If Mars is in 7th house with no aspects of benefics
      intercourse occurs with unmatured girls. If three quadrants are occupied by evil planets,
      happiness with wife is not indicated. Eighth Bhava (House).—Indicates longevity, secret
      organ, death, legacies and gifts and unearned wealth, cause of death, wills, disgrace
      and degradation, the place of death and the surroundings of death. If the lord of the
      8th joins the 12th with a malefic, there will be short life. Life will be short if the
      lord of the birth and the lord of the 8th join the 6th. There will be long life if the
      birth lord occupies beneficial houses with the lord of the 8th. If all malefics occupy
      the 8th, death will be instantaneous. If Saturn is in the 12th and the lord of the 8th
      in the 2nd with a benefic, death occurs in the 21st year. If the lord of the 8th is
      in the 5th in conjunction with malefics and the lord of the 10th is in the 2nd aspected
      by malefics, the native dies in the 2nd year. If quadrants are occupied by benefics
      and the lord of birth combines with a good planet aspected by Jupiter, a very long life
      may be predicted. If the lords of the 8th, 1st and 10th combine with Saturn and occupy
      quadrants, life will be long. When the lords of the 2nd and 6th combine with Saturn
      and occupy 3, 6 and 12, death will occur from diabolical gases. If Saturn becomes the
      lord of the 6th and joins with Rahu or Kethu, death will be from the attack of beasts.
      If in the same combination Jupiter has prominence, danger arises from elephants. If
      Saturn joins the Sun and occupies or aspects the 8th, death will be from dogs. If the
      weak Moon occupying the 8th with Rahu joins malefics, the person dies by the troubles
      of apparitions and spectres. If the 6th house is occupied by its lord and the lord of
      the 8th is with Rahu, and Saturn with Kethu aspected by Mars, the person will be killed
      by weapons. If the Sun in debilitation occupies the 6th or 8th aspected by a malefic,
      the father will die through kingly displeasure. If Mercury is not well situated and
      occupies an unfavourable position, death takes place from sudden heart-failure. If the
      8th is favourably situated with the aspects of Mercury, Venus and Jupiter, the native
      will bequeath vast legacies to his successors. If the 8th is occupied by Saturn, and
      Mars aspects it with his special aspects, the person will contract many debts and no
      redemption can be expected for generations to come. If the 8th becomes a movable sign
      and its lord also is found in a movable sign, death takes place in a foreign country.
      If the 8th and its lord are in a fixed sign and Saturn is similarly placed, the person
      dies in his own house. If the 8th house falls in a common sign and its lord also occupies
      a common sign, death will occur while travelling. If Mars gets prominence and the combinations
      are placed as above, death takes place in motors and railways. Mercury kills the native
      in balloons and airships. 167 Saturn inflicts death on water. The Sun causes death by
      self-immolation for others'' cause provided he is not debilitated. Ninth Bhava (House).—Represents
      godliness, righteousness, preceptor, grandchildren, metaphysical studies, imagination
      and intuition, religion, devotion, law, sympathy, philosophy, science and literature,
      lasting fame, leadership, charities, communication with spirits, ghosts and the like,
      long journeys, father and travel. If the weak Moon occupies the 9th in a debilitated
      state or Venus is bad and occupies evil conjunctions or if the lord of the 9th is debilitated,
      the native will be guilty of improper relations with his preceptor''s wife. If the 9th
      is occupied by benefics and the lord of the 9th combines with no malefics, the person
      rests content with his own wife. If the lord of the 9th is in the 8th or any movable
      sign, the child will be born when its father is not in the place. If the lord of the
      9th joins the navamsa of Jupiter, the person becomes righteously inclined and charitable
      in disposition. 168 If the 9th is occupied by Venus, Kethu and the Sun proficiency in
      miscellaneous subjects is to be predicted ; Kethu in the 9th makes a man interested
      in mesmerism. If the lord of the 9th is in the 4th aspected by Saturn, the person will
      be charitable in disposition and irritable in temperament with an invincible bigotry.
      If the lords of 1 and 9 are powerful and the Sun is aspected by benefics, the native
      will be obedient and dutiful to his father. If the lord of 9 is in quadrants or in trines,
      the person becomes well acquainted with metaphysical lore provided such a combination
      has the aspect of Jupiter. If Rahu and Saturn occupy the 9th and otherwise badly situated,
      the person will be cold-hearted, engaged in inflicting miseries and injuries on innocent
      people and quite unsympathetic. Mars and Kethu in the 9th with Jupiter in the 2nd and
      Mercury, the Sun and Venus in the 5th, 6th, and 7th respectively, make the man extremely
      rich. If the lord of the ascendant joins the 9th and combines with the lord of the 5th,
      wealth may be predicted through children. If Mercury is the lord of the 9th or aspects
      its lord and if Guru occupies an exalted position, the person will be highly learned
      in mystical philosophy. If the lord of the 10th is the Sun, who is well placed and powerfully
      aspected, income will be from inherited wealth from drugs, medicines and chemical dealings.
      If the Moon occupies the 10th house and Mars aspects it, the native will earn money
      by selling precious stones and dealings with aristocracy, low women and agriculture
      to some extent. If Mars is the lord of the 10th or occupies it and is aspected by the
      Sun or the Moon, the person will be a respectable Commander-in-Chief; if by Saturn,
      a gang leader and a robber; if by Mercury, a doctor. If the 10th is occupied by Mercury,
      the native will be a professor in religious philosophy and earns his livelihood as such.
      If Jupiter becomes the lord of the 10th or aspects it, livelihood might be predicted
      through being a preceptor to eminent families. Venus as the lord of the 10th house gets
      the native income from brokerage, as managers of brothels and other mean associations.
      If Saturn occupies the 10th or aspects it with no beneficial conjunction, earnings will
      be from being a municipal official or even a scavenger. If Pisces becomes the 10th house
      and Mercury or Mars occupies it, the person will have Mukthi or emancipation and will
      have dips in sacred waters. If Jupiter joins Mercury or Mars, the person builds charitable
      choultries and performs meritorious deeds. If the Moon occupies a quadrant and Jupiter
      aspects her, he will have pure reputation for his conduct and truthful nature. If Mars
      and Saturn are in the 10th aspected by other malefics, the person will have communication
      with super-naturals. If the 10th house is a watery sign and its lord occupies a movable
      rasi and navamsa, the person will have foreign travels on water. If the Sun is also
      in the 10th, the travel will be on some political mission. If the lord of the 11th is
      in exaltation and in a Kendra (quadrant) and if Mercury becomes the lord of the 2nd
      much gain will accrue from trade. If the lord of the 11th is aspected by the lords of
      the 2nd and 4th and combines with the lord of the 9th, the man becomes very rich and
      exercises frugality in expenditure. If the lord of the 11th is a benefic and has beneficial
      aspects, the person will be attracted towards decent ornaments. If Jupiter occupies
      the 11th and Mercury aspects it, the person gains much reputation as a philosopher and
      lecturer. If the lord of the 11th is a benefic aspected by benefics and occupying favourable
      positions, the person will have perfect contours. If the above combination is afflicted
      by Saturn or Mars, the person becomes deaf. If the lord of the 11th and its occupants
      are powerful, the native will have powerful influence in society. If the 11th is occupied
      by Saturn, Mars, Rahu and the Sun with no other benefics aspecting it, the person will
      be miserable. Twelfth Bhava (House).--Indicates loss, expenditure, waste, extravagance,
      sympathy, piety, divine knowledge and worship, Moksha (final emancipation) and the state
      after death. If the lord of 12th is aspected by the lord of 7th and these two are powerful,
      the native''s money and influence will be wasted through the agency of his wife. If
      the 12th is occupied by a malefic and its lord is an evil planet, money will be spent
      on immoral purposes. If the powerless lord of the 12th occupies unfavourable positions
      in the navamsa, the native will have deformed limbs. If the lord of the 12th is Jupiter
      and has no malefic influences or aspects, the person will die in divine contemplation.
      If the lord of the 12th is Mars and Saturn occupies the 12th, death takes place on account
      of piles and other bloody diseases. If the lord of the 12th is weak and is seen by lord
      of 6, money will be spent on useless litigation. If the Sun and the Moon are in the
      12th without any favourable aspects, the native will be a simpleton. If benefics occupy
      12 or its lord joins with them the person will have close relations surrounding him
      at his death. YOGAS in Sanskrit astrological nomenclature mean special planetary combinations
      for the production of high political and special power and influence, great wealth,
      philanthropy, asceticism, misery, debts, demoralisation and corruption. In all horoscopes
      these yogas must be properly scrutinised along with the application of the usual astrological
      rules. These important yogas make or mar a man for, if special aristas or misfortunes
      are found in a horoscope, the person will be always miserable, even though, according
      to ordinary astrological rules, such a horoscope is a promising one. The word Yoga is
      quite indigenous and such a system cannot be found in the astrological principles of
      other nations. These reveal a flood of information to the astrological student, when
      properly studied and applied. The Western reader must clearly comprehend the technicalities
      involved in the application of these yogas and try to understand their significance
      thoroughly. 175 The yogas may be Rajayoga—producing high political power; Dhanayoga
      or combination for great wealth; Gnanayoga or combination for real higher knowledge
      and renunciation of the world; and Aristayoga—series of misfortunes of the most baneful
      nature. There are thousands of such yogas given in the original Sanskrit works and their
      reproduction here would mean firstly a great strain on the comprehending powers of the
      reader and secondly increase of the bulk of the book beyond proportion. The results
      ascribed to each yoga will completely manifest themselves if the yogakarakas (planets
      producing such yogas) are not afflicted. For more detailed information I would refer
      my readers to my own book Three Hundred Important Combinations. I shall now briefly
      sketch all the favourable yogas and their probable results.'
    quote_sha256: 68d1004e7aebbd759d4553e82408c5370943d53ffe2d3e3fdf0397e2385a1865
