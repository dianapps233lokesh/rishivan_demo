    quote: >-
      A weak Moon, if having conjunction with the malefic planets brings sufferings to wife
      and children etc., conflicts with the society, degradation in service, confrontation
      with public, wrath of the king, loss of wealth, animals and prosperity. If the Moon
      is situated in the 6th, the 8th or the 12th house, danger from water, loss of confidence,
      imprisonment, fear of disease, change of place, visits to unwanted places, controversies
      over litigations, meagre food, distress caused by theft and authorities, urinary connected
      diseases and other health hazards, will be the pronounced results during the Antardasa.
