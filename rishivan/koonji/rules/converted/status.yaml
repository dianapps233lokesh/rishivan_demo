    locator: ch25.v1-4
    quote: >-
      1-4 O Brahmin, now I explain to you the effects of the 12th House: If the 12th Lord
      has a benefic planet with him, is in his own sign or in his sign of exaltation, the
      native's expenses are made on good accounts. If the Moon happens to be the 12th Lord
      and is situated in the 9th, 11th or 5th House, in her exaltation sign or own sign or
      in her own Navamamsha or in the Navamamsha of 11th, 9th or 5th sign, the native will
      enjoy beautiful houses, beds and superior scented articles. One having these combinations
      passes his life comfortably as he is endowed with such clothes, beautiful garlands and
      ornaments. He is gifted with riches and is learned and lordly.
    quote_sha256: 77cc4310750a26935034ab90705aae6741b2586f9052f2e42a528ab5a854d667
