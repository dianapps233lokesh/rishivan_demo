  when:
    dignity:
      subject: graha.moon
      dignity: dignity.friendly
  indicates:
    claim: status.recognition
    polarity: positive
    magnitude: moderate
    text: person born will be esteemed
- id: JATAKAPARIJATA.STATUS.CH9V13.0001
  version: 1.0.0
