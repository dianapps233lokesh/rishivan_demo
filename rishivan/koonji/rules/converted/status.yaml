      from_rule_key: lagnesha_in_4th
    review:
      state: unreviewed
  when:
    occupies_bhava:
      subject: lord.bhava.01
      bhava: bhava.04
  indicates:
    claim: family.siblings
    polarity: positive
    magnitude: moderate
    text: blessed with many brothers
