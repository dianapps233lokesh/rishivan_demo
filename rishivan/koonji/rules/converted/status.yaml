    quote: >-
      When the Ascendant lord, Mercury, Jupiter or Venus are in a Kendra or a Trikona (angle
      or trine) the native will be longlived, wealthy, intelligent and favourite of the king.
      The Ascendant lord being placed in a movable sign and having the aspect of a benefic
      planet confers on the native fame, wealth, abundant pleasures and comforts of the body.
      If Mercury, Jupiter or Venus are situated in the Ascendant together with the Moon or
      if they are in a Kendra from the Ascendant the native is endowed with royal marks.
