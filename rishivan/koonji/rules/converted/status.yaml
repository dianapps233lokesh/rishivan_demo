- id: BPHS.FAMILY.CH16V711.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.status: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch16.v7-11
    quote: >-
      If the third house is occupied by Mercury and the Lord of the third house is together
      with the Moon, the significator of this House, Mars with Saturn, then the native will
      first have a sister before him and after him a brother and the third will be a brother
      who will die. If the significator Mars is in conjunction with Rahu, and the Lord of
      the third house is in his sign of debilitation, there will be loss of younger brother
      but there will be 3 brothers before the native. If the Lord of the House of brothers
      (the 3rd House) is in a Kendra (angle) and the Significator Mars is placed in trikona
      (trine) from him in his exaltation together with Jupiter, 12 brothers of the native
      should be known; of these, the two elder brothers of the native and third, seventh,
      ninth and twelfth from him will die, the remaining six brothers will have long life.
    quote_sha256: 65dbc12bfd758ad9571df4b67b39ab3f6ef69d5b8c421105dc97a3cb0d6045f0
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: koonji_16_7_11_rule_2
    review:
      state: unreviewed
  when:
    all:
    - conjunct:
        subject: graha.mars
        other: graha.rahu
    - occupies_bhava:
        subject: lord.bhava.03
        bhava: bhava.03
    - dignity:
        subject: graha.mars
        dignity: dignity.debilitated
  indicates:
    claim: family.siblings
    polarity: positive
    magnitude: moderate
    text: there will be 3 brothers before the native
