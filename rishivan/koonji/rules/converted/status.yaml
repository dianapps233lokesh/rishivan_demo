- id: BPHS.FAMILY.CH8V3943.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.status: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch8.v39-43
    quote: >-
      The Ninth house from the Ascendant and the ninth house from the Sun give us knowledge
      about one's father. Whatever matters are to be considered from the study of the 10th
      and the 11th houses from the ascendant may also be known from the 10th and 11th from
      the Sun. The matters that are considered from the first, fourth,second, ninth and eleventh
      houses from the Ascendant those must also be considered from the first, fourth, Second,
      ninth and eleventh houses from the Moon. All those matters that are to be considered
      from the third house from the ascendant are also to be analysed from the third house
      from Mars. The consideration of those matters that are known from the 6th house from
      the ascendant is also to be done from the 6th house from Mercury. The consideration
      of Progeny is to be made from the fifth house from Jupiter, that of spouse from the
      seventh house from Venus and, that of death and longevity from the 8th house from Saturn.
      Expenditure is to be known from the 12th house from Saturn also. The effects that are
      considered from the study of a particular house are also to be known from the study
      of the Lord of that house. The effect of it should be known from that and it may be
      thought of as auspicious or inauspicious accordingly.
    quote_sha256: eebbf347495aedf5941cd20d1371797693b82a068f056e5a2b651e9ec6ea27c0
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: 8.39_43.surya_lagna_9
    review:
      state: unreviewed
  when:
    occupant_count:
      bhava: bhava.09
      op: eq
      n: 0
  indicates:
    claim: family.father
    polarity: positive
    magnitude: moderate
    text: Knowledge about one's father may be known from the ninth house from the Sun.
