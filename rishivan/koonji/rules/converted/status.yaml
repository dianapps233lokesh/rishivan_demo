- id: BPHS.FAMILY.CH26V4.0002
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.status: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch26.v4
    quote: 'Should the Ascendant Lord be in the 4th House the native will be blessed with
      paternal and maternal happiness, many brothers and will be lascivious, virtuous and
      charming.

      Notes : When the Ascendant Lord falls in the Fourth House, the native will not only
      be lustful, he will also become mentally very sensitive. The Fourth House is related
      to the mind and psychological effects. The Ascendant is itself the body. The psychology
      of sex is quite near to the body. Therefore, the native may be lustful. Such a man takes
      special care of his body. He is always engaged in adorning his body and improving his
      personality.

      The auspicious effects that have been told in this sloka will not be seen when the Ascendants
      are Aries and Capricorn. In these Ascendants they will be reversed because in these
      Ascendants the Ascendant Lord will be in his sign of debilitation when placed in the
      4th House.'
    quote_sha256: 63ef1f5d81f3e28100c77eed3f942c88ea44954741a97824288ab9cc49b8893c
    authority_tier: S0
    extraction:
      method: converted
