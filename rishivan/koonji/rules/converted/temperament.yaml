- id: JATAKAPARIJATA.TEMPERAMENT.CH17V76.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.temperament: 0.7
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol2
    locator: ch17.v76
    quote: >-
      Sloka 76. If Mars and Mercury be together in the 9th bhava, the person born will be
      learned in the sacred books and devoted to pleasure and ease ; if Mars combine with
      Jupiter in that bhava, the person concerned will be wealthy and respected The effect
      of Mars being associated with Venus in the 9th bhava is that the person born will have
      two wives and will be an ex- pounder of law in a foreign land. If the planet combining
      with Mars in the 9th bhava be Saturn, the influence of the yoga on the person born is
      to make him wicked and addicted to women not his own. When Mercury and Jupiter are found
      together in the 9th bhava, the person born will be keen-witted, wise, wealthy and learned.
    quote_sha256: 786bc1db05011e4d3be1b4e4d0cad6e61d9ab1e3ef4b3b858538566c62214f0d
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: mars_saturn_in_9th_4
    review:
      state: unreviewed
  when:
    all:
    - occupies_bhava:
        subject: graha.mars
        bhava: bhava.09
    - conjunct:
        subject: graha.mars
        other: graha.saturn
  indicates:
    claim: temperament.disposition
    polarity: negative
    magnitude: moderate
    text: the person born will be wicked
- id: JATAKAPARIJATA.TEMPERAMENT.CH17V87.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.temperament: 0.7
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol2
    locator: ch17.v87
    quote: >-
      Sloka 87. If the Sun, Mars, Jupiter and Saturn be together in the 9th bhava, the person
      born acquires wealth by his daring and prowess. Venus, Mars, Jupiter and the Moon in
      the 9th bhava make the person born valiant, endowed with every virtue and a critical
      faculty to appreciate works of art. When the combination in the 9th bhava generally
      consists of 6, 5, 4 or 3 planets, the person born attains prosperity. If the combination
      includes Mercury, the person concerned gets regal power ; but if the combination be
      without Mercury or Jupiter, the person born gets evil fortune for his lot.
    quote_sha256: b5c1269fb0546663aeeca30c790b5107344f73a29e22652250efa24f85c43490
