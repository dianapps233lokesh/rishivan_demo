- id: JATAKAPARIJATA.TEMPERAMENT.CH9V3.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.temperament: 0.7
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol1
    locator: ch9.v3
    quote: >-
      Sluka 3. When the Moon is in conjunction with Jupiter, the person born will be very
      intelligent and protect good people. When Venus is associated with the Moon, the effect
      of the yoga on the person born will be that he will be evil-minded and clever in making
      bargains. If the Moon be in conjunction with Saturn, the person born will have a bad
      wife, abuse his parents and will be without wealth. If Mars and Mercury be together,
      the person born in the yoga will be eloquent and clever in medicine and fine arts.
    quote_sha256: 06ec0bf7e963ac02a731c5d6b7c230a10b370ade988ae09683630b15cf243a95
    authority_tier: S0
    extraction:
