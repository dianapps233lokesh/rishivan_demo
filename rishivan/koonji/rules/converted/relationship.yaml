- id: HINDUPREDICTIVE.RELATIONSHIP.CH15V6.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.relationship: 0.7
  source:
    book: hindu-predictive
    edition: hindupredictiveastrology-raman
    locator: ch15.v6
    quote: >-
      If the dasa of a death-inflicting planet does not at all come into operation, then the
      most malicious planet in the horoscope will cause death. Saturn, inclined to produce
      evil by his conjunction with the lords of death houses, will cause death in preference
      to any of those planets. There are many rules to ascertain the probable time of death
      knowing beforehand Maraka dasas. Any detailed information in regard to this would increase
      the bulk of the book beyond reasonable proportion. Add together the longitudes of Saturn,
      Jupiter, the Sun and the Moon. This gives us a point in the zodiac after expunging multiples
      of 12. In the case of short, middle and long life, death occurs when Saturn transits
      over this point, in his first, second and third cycles respectively. THE notable triumphs
      in Hindu astrology so far as the predictive portion is concerned are entirely due to
      the great scrutiny, the planetary influences are subjected to in the analysis of a horoscope
      and the relative values of the good and evil sources of strength of different planets
      and bhavas. The following points are noteworthy in the consideration of a horoscope.
      The lords of trines are always auspicious and produce good. The lords of kendras (quadrants)
      are also good. When malefics become lords of quadrants they invariably become good.
      The lords of the 2nd and 12th houses give good results if they are in conjunction with
      favourable planets. The lord of the 8th if he happens to be the lord of the first or
      is in conjunction with a benefic, becomes good. Mars in addition to the 10th house,
      if he also becomes the lord of the 5th, produces good. Rahu and Kethu produce good results
      when they are posited in the signs of benefic planets. 128 Good and evil planets become
      more and more powerful as they are lords of the 1st, 4th, 7th or 10th houses; 5th and
      9th houses; or 3rd, 6th and 11th houses respectively. Lords of 3, 6, 8 and 11 do evil
      and cause miseries in life. The lords of 2nd and 12th remain neutral. Jupiter and Venus
      owning quadrants become very inauspicious. In addition to this when they occupy the
      2nd and 7th houses they become very powerful and consequently inflict death upon such
      natives. Mercury as the lord of a quadrant is less malicious than Jupiter and Venus
      and the Moon less than Mercury. Mars does not become good when he owns the 10th house.
      Rahu and Kethu in evil signs produce evil. The lords of quadrants and trines in conjunction,
      without any other bad aspects, become extremely powerful in producing good results.*
      If the lords of the 9th and 10th houses exchange places they produce much good. The
      greatest assets of a man in this life, apart from the shadowy wealth and fame, are *
      See How to Judge a Horoscope. 129 9 self-respect, courage and prowess. In a horoscope
      these can be determined by considering Mars and the characteristics attributed to him
      which are discussed in the future chapters. But here I shall confine myself to the discussion
      of the most salient points involved in the judgment of a horoscope. The lord of the
      3rd also must be considered ; both of them must occupy a friendly house and must be
      found not in a Bhava sandhi (junction of two houses) but in a Bhava-madhya (mid-point
      of a house). Mars must occupy the 10th for good courage and the lords of the 3rd and
      11th should occupy favourable and friendly navamsas. The position of Jupiter also considerably
      improves the situation by making the person not depending upon another but to earn the
      name of a self-made man. Jupiter adds to the dignity of the person in a sure but silent
      way. Marriage is a landmark in the history of human race. With regard to the number
      of wives, the character and temperament of one's wife, her disposition towards the husband
      and her own health and happiness, much information is incorporated in Chapter XIX under
      the caption 7th house or Saptamabhava, and the student must pay special attention to
      that chapter for fuller details. Venus gets the Commander-in-Chief post over matrimonial
      alliances and all things concerned about them and the 7th house controls marriage in
      general. In hundreds of horoscopes, it has been observed that Venus when afflicted has
      given rise to more than one legal wife. It could be vouched with sufficient confidence
      that Venus in favourable positions is certain to assure marital felicity and success
      with a single wife. The marriage aspect would be most important to the Hindus among
      whom the dangerous contagion of divorce has not spread as in the Western nations. Considerable
      attention has been bestowed upon this subject by the ancient writers. When Venus occupies
      the house of Jupiter or that of the lord of the 1st or 9th either in the rasi or navamsa,
      the native will have a chaste, loving and happy wife. 7th house should not be occupied
      by any planet save a benefic. In the case of a woman the Moon must occupy the navamsa
      of Jupiter to make her loyal and chaste and should never fall in the navamsa of Saturn
      or Mars. Mars in the 8th house causes widowhood. Lords of 3, 6 and 11 play an important
      part in causing debts, diseases and ill-health. The best feature in a horoscope would
      be that those lords of 3, 6 and 11 must remain isolated and unassociated with any other
      planet. The lord of the 3rd causes debts and diseases in a speed ; and ill-timed courage
      and headlong spirit work much in the native. Egotism and misanthropy are marked by the
      lord of the 6th, in exercising discretion, who has special control over debts and diseases.
      Anarchic qualities would result if the lord of the 11th is very powerful. Delicate circumstances
      involving life and honour for the sake of debts and diseases can be overcome but for
      Mars and Saturn who if they occupy unfriendly signs give rise to excess of evil. The
      Sun governs father, and the 9th house indicates father. Jupiter has control over children
      as he is called Putrakaraka and the 5th house is Putrasthana or the house of children.
      The fourth represents mother and the Moon governs her. When the lords of 4, 5 and 9
      and the Moon, Jupiter and the Sun are well situated, and occupy favourable and friendly
      navamsas prosperity for father, mother and children is invariably indicated. An examination
      of a number of horoscopes has revealed that the Moon, Jupiter or the Sun in the 4th,
      5th or 9th with Saturn has caused death to mother, children or father respectively early
      in life. Moon with Saturn without any favourable aspect has caused death to the mother
      within one year of the birth of the child. Mercury and Mars in the 5th house make the
      children short-lived. Jupiter in the ascendant is the best gift in a horoscope and the
      native gets dutiful children and long-lived parents. Long life for an individual may
      be predicted if the lords of 1 and 8 and Saturn are in good positions and have the aspect
      of Jupiter. This important and final event is elaborately dealt with in a separate chapter
      and the readers must study the principles contained in it very carefully. 133 AS soon
      as the dasas and bhukthies are determined, the next step would be to find out the good
      and evil planets for each ascendant so that in applying the principles to decipher the
      future history of man, the student may be able to carefully analyse the intensity of
      good or evil combinations and proceed further with his predictions when applying the
      results of dasas and other combinations. Aries.—Saturn, Mercury and Venus are ill-disposed.
      Jupiter and the Sun are auspicious. The mere combination of Jupiter and Saturn produces
      no beneficial results. Jupiter is the Yogakaraka or the planet producing success. If
      Venus becomes a Maraka he will not kill the native but planets like Saturn will bring
      about death to the person. Taurus.—Saturn is the most auspicious and powerful planet.
      Jupiter, Venus and the Moon are evil planets. Saturn alone produces Rajayoga. The native
      will be killed in the periods and sub-periods of Jupiter, Venus and the Moon if they
      get death-inflicting powers.
    quote_sha256: f507144cb97448e1f5d65cef93ebf6632c5a614f344aa99a70fca0489ff39525
