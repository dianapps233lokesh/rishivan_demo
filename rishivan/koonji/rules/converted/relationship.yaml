    quote: >-
      Sloka 24. When a malefic sign representing the 7th bhava is occupied by Saturn the female
      will become afflicted with widowhood. If Venus and Mars occupy each other's Rasi or
      Amsa, she will be a "coquette and addicted to a paramour. (Cf. sloka 19, supra.) If
      the Moon be in the 7th bhava, she will lead a depraved life along with her husband.
      If the Moon and Venus occupy the 1st bhava identical with a sign owned by Saturn or
      Mars and if a malefic planet be in the 5th bhava, the female concerned will be barren.
    quote_sha256: cf74cb515f9e355ac592b80e61c3a7977b9823c32cf61c0f24645bc59365dcc5
