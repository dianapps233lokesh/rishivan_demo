- id: BPHS.RELATIONSHIP.CH54V46.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.relationship: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch54.v4-6
    quote: 'In the running Mahadasa of the Sun with the Moon Antardasa, if the Moon is posited
      in the Ascendant, Angles or Trines, the marriage or other auspicious functions will
      take place and one gets fame through wealth and prosperity, growth in land and property
      and gratifying feelings with the acquisitions of vehicles, animals and other assets.
      If the Moon occupies own or exalted sign, woman''s affection, gain of wealth is caused
      and happiness of son''s birth, King''s recognition and blessings, contentment over the
      attainment of desired objectives, will also be the results.

      If the Antardasa''s lord is also the lord of the 2nd house and occupies 11th or any
      other good house, the native will have good gain of wealth during this period. He will
      also acquire fixed assets of the kind which will be useful for his children. An example
      related to this aspect, is illustrated as under : Example 19 :

      Balance Dasa at birth : Ketu 1 year 9 months 2 days. Mahadasa of the Sun and Antardasa
      of the Moon from 8.8.1971 to 7.2.1972. Data: Date of birth 19.7.1949; Time of birth:
      3-25 hrs. (IST)

      Lattitude 28°-43'' N Longitude 77°-50''E In this duration, the elder brother of the
      native who had no issue, but had abundant wealth and immovable property in the form
      of agriculture land which was to be inherited by the native''s sons as per the ''will''
      of his brother. The 2nd house signifies parental property and this house also represents
      the elder brother''s immovable property being the 4th house from the 11th house. The
      house of wealth of the elder brother (2nd from 11th) has the lordship of Venus which
      is posited in the 2nd house of the native. Therefore, the liquid cash, Jewellery etc.,
      was inherited by the native. Since the Sun is posited in the 2nd house (Wealth) in the
      sign of the Moon, situated in the 11th house (gain) whose dispositor Mars (brother)
      is in conjunction with Venus (lord the house of wealth of the elder brother) also having
      the aspects of Jupiter, these results got fructified in the Main period of the Sun and
      sub-period of the Moon. With the acquisition of the assets, the native had been taken
      to a high status in the society. This factor is quite evident from Dasamsa Chart where
      the Moon is posited in the Ascendant and in its own sign.'
    quote_sha256: 55fc2b8e7fa31f075027642423676f4eebe85433d718fd83e348fe710bea1ad5
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: sun_moon_dasha_moon_kendra_trikona_1
    review:
      state: unreviewed
  when:
    any:
    - occupies_bhava:
        subject: graha.moon
        bhava: bhava.01
    - occupies_bhava:
        subject: graha.moon
        bhava: bhava.04
    - occupies_bhava:
        subject: graha.moon
        bhava: bhava.07
    - occupies_bhava:
        subject: graha.moon
        bhava: bhava.10
    - occupies_bhava:
        subject: graha.moon
        bhava: bhava.05
    - occupies_bhava:
        subject: graha.moon
        bhava: bhava.09
  indicates:
    claim: relationship.harmony
    polarity: positive
    magnitude: moderate
    text: marriage or other auspicious functions will take place
