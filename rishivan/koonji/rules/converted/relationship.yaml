    quote: >-
      7-8 1/2 If the Sun is placed in the 7th House, the native will have the company of barren
      women, if there is the Moon in this house he will have a wife of the nature of the sign
      in the 7th House, if Mars is placed there he will have the company of a girl having
      menses and who is barren : Similarly, if Mercury is placed in the 7th House the native
      will befriend a harlot ,a low caste woman or a female belonging to the trader community.
      In case Jupiter be there he will have relation with the wife of a Brahmin or with a
      pregnant woman; and in case Saturn, Rahu and Ketu have gone there (in the 7th House)
      he will have relation with a base woman and with a woman having menses.
    quote_sha256: 2bba8326c52ecc8ebe000361b1804167e994054d00e405c97efc3740e8788b50
