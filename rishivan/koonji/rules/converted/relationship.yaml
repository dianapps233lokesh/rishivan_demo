    quote: 'Should the Ascendant Lord be placed in the Third House, the native will be equal
      to lion in valour, will have all kinds of wealth, will be honourable, will have two
      wives and be intelligent and happy.

      Notes : The 3rd is the House of bodily strength and valour. If the Ascendant Lord is
      in the 3rd House, the native will be marvellously enterprising and will have the courage
      to face every situation. The faculties of the body become most flourishing in the Third
      House, and the body is represented by the Ascendant and its Lord. The Ascendant Lord
      being placed in the Third House, the native will require more nutrition and his diet
      will be richer. In case the Ascendant is Gemini and the Ascendant Lord has gone in the
      Third House, the native becomes ascetic towards earning money from the age of 40 or
      45. His vitality and strength are decayed. In Aquarius Ascendant also when the Ascendant
      Lord occupies the Third House Saturn will be in his debilitation sign and opposite effects
      will be seen.'
