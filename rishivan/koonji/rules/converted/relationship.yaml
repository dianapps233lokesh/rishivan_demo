- id: JATAKAPARIJATA.RELATIONSHIP.CH17V54.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.relationship: 0.7
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol2
    locator: ch17.v54
    quote: 'Sloka 54. In this chapter on Female Horoscope, we have given accurately with reference
      to husbands the same information which we gave while treating of men''s horoscope regarding
      wives such as the regions from which they may come, their status, the protection of
      their virtue and the qualities evinced in their acts. The number of children will correspond
      to the number of Navamsas attained by the powerful among the planets occupying the 7th
      bhava or its Amsa. The lord of that bhava when occupying a Kendra will produce much
      jubilation on marriage and other festal occasions.

      Thus ends &c. The (कालचक्र) kalachakra system of ayurdaya referred to already in Adhyaya
      5, sloka 33, is based on the Moon''s position in a नक्षत्रपाद or quarter of an asterism.
      For the purposes of this ayurdaya, the 27 stars from Aswini to Revati are classified
      into nine groups of three each, the five odd groups or triads being styled सव्य (Savya)
      or दक्षिण (Dakshina) and the four even ones as अपसव्य (Apasavya), वाम (Vama) or उत्तर
      (Uttara). The peculiarity of a सव्य (Savya) triad is that its 12 padas (पाद) are assigned
      to the 12 Rasis from Mesha onwards. In an अपसव्य (Apasavya) triad, the 12 padas belong
      to the 12 Rasis reckoned in a reverse order from वृश्चिक to धनुष. The 12 Nakshatra padas
      (नक्षत्रपाद) whether of a सव्य (Savya) or of an अपसव्य (Apasavya) triad can be brought
      under the four triangular signs according to the Rasis to which they are severally assigned.
      In accordance with this classification, four kinds of परमायुस् (Paramayus) or maximum
      life will be shown to result (Vide sloka 12). Each कालचक्रनक्षत्रपादआयुस् (Kalachakra
      nakshatrapadayus) in its entire length comprises nine mahadasas (महादशा) presided over
      by nine Rasis and their lords. The order in which the several Nakshatra padas get each
      its nine mahadasas is indicated in the mnemonic formulas for the सव्य (Savya) and अपसव्य
      (Apasavya) chakras respectively. These formulas are expressed by conventional letters
      कटपयादि (Katapayadi) referred to already in page 696. Two additional letters भ and श
      used in the formulas denote the numbers 11 and 12 respectively. It appears to be an
      accepted canon in the kalachakra system that the maximum length of the life of any person
      whether born in the beginning, middle or end of a नक्षत्रपाद (nakshatra pada) should
      not exceed the length of the nine mahadasas (for that pada) reckoned from that at birth.

      For a knowledge of the terms देह (Deha), जीव (Jeeva), मण्डूकगति (Mandukagati), मर्कटगति
      (Markatagati), सिंहावलोकन (Simhavalokana), the reader should refer to slokas 89—92.
      In connection with the terms मण्डूकगति (Manduka gati) and मर्कटगति (Markata gati), it
      will be interesting to note that in a सव्यचक्र (Savya chakra), the two movements take
      place from Kanya to Kataka and Simha to Mithuna respectively, while in an अपसव्यचक्र
      (Apasavya chakra) they are invariably from Kataka to Kanya and Mithuna to Simha and
      these occur only in the cycles which run from Vrischika to Dhanus and vice versa.

      A reason for this will appear when we remember that it is only by such an arrangement
      the order of planets in both the cycles can be made identical.'
    quote_sha256: cbdadf168ac07705fd2e4bb78f70ef979b44f53e30ddd9eb89217ac9bb6e1e60
