    quote: >-
      If the Sun is exalted, or posited in its own sign, the 11th house, Angles (Kendras)
      or Trines (Trikonas), there will be gain of wealth and food grains in the Antardasa
      of the Mahadasa of the Sun. Reverse will be the results if the Sun is in debilitation,
      inauspicious sign etc. The Sun being the lord of the 2nd or the 7th house, it will cause
      apprehension of early death. In order to guard against these ill effects, “Mrityunjaya
      Japa” be recited (or have it done through some one). Undertaking the worship and other
      religious observance of the Sun, will bestow good health.
