      principle worth noting and its rationale is perfectly understandable. Lord of the 2nd
      from Mesha is Sukra, when he is in the 12th or Meena, he gets exalted and thereby the
      2nd lord becomes strong Stanza 13. For a person born in Mesha, Guru, in the 11th house
      cannot give rise to any yoga during his dasa Stanza 14. For one born in Mesha, Budha
      and Kuja in the 6th will give rise to wounds, skin eruptions, small pox and the like
      during their Dasas. Stanza 15. A Person born in Mesha lagna will possess self-earned
      fortune and some wealth also, if Mars and Venus are in the 7th house. Stanza 16. For
      one born in Mesha lagna Mars in the 8th house does not produce yoga, he will however
      confer some fame if he is in conjunction with the Sun and Venus Stanza 17. For a person
      born in Mesha lagna if the Sun and Mars are in the 9th as also Jupiter and Venus, and
      Saturn is in the 7th, then Mars produces special yoga. Stanza 18. For a person born
      in Mesha lagna, Venus becomes capable of giving rise to yoga provided he is in lagna
      with the Sun unaspected by Jupiter Stanza 19. Venus aspected by Jupiter will not certainly
      confer any Yoga But the Sun aspected by Jupiter becomes a yogakaraka. Stanza 20. For
      a person born in Mesha lagna, if the Sun, Mercury and Venus are in the 11th, they will
      give rise to fortune during their respective dasas. Stanza 21. For a person born in
      Mesha, Raja yoga is caused if the Sun or Moon is in Cancer. Stanza 22. A person born
      in Mesha lagna will have dips in the Ganges in the dasas of Venus, Jupiter and the Sun
      if the said planets are in the 10th.
