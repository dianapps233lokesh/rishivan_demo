    edition: jatakaparijata-sastri-vol1
    locator: ch9.v5
    quote: >-
      Sloka 5 If Venus be in conjunction with Mercury, the person born will be versed in the
      sacred books, and fond of music, play and mirth. If Saturn be associated with Mercury,
      the person born will be learned, wealthy and distinguished for his moral worth. The
      man at whose birth Jupiter and Venus occupy one sign will be energetic, in favor with
      the king and exceedingly intelligent. If Jupiter be in conjunction with Saturn, the
      effect of the yoga will be that the person born in it will be an artist. If Venus and
      Saturn be together at a birth the person affected by the yoga will own large herds of
      cattle and be an athlete.
