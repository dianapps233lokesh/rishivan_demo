      with thick hands and feet, deserts her husband and a voracious eater. If Venus be in
      the 8th house, she will be lethargic, bereft of wealth, irreligious, cruel, filthy and
      cunning. If Saturn is situated in the 8th house, she will be ill mannered, remain filthy
      and deprived of her husband's affection. Rahu's being in the 8th house, she will be
      repulsive (ugly), without a husband, stone hearted, sickly and of a bad conduct.
