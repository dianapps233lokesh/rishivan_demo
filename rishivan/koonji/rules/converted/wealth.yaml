      affection of the ruler; exaltation of good fortune; birth of a child; gain of wealth
      through honest means. Listening to religious or ancient scriptures (Purana-पुराण); company
      of eminent romantic poets; festivity on the visit of beloved ones, great affection from
      the employer (ruler), sweets with daily meals.
