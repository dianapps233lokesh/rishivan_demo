    quote: 'In the event of the 12th Lord being placed in the 4th House, the native will be
      devoid of maternal happiness and will day by day have losses in respect of lands, conveyances
      and houses.

      Notes : A native having this combination often sells his lands, conveyances and houses
      in order to accomplish his deed in relation to earning wealth. Therefore it has been
      said that if the 12th Lord is situated in the 4th House the native will have day by
      day losses in respect of lands, conveyances and houses. It is the natives having Gemini
      and Leo Ascendants who are devoid of maternal bliss because in these Ascendants the
      12th Lord will be debilitated in the 4th House. The natives born in the Aries and Scorpio
      Ascendants will have special maternal bliss because in these Ascendants the 12th Lords
      will be exalted in the 4th House.'
