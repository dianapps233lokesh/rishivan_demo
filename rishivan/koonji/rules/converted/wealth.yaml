- id: BPHS.WEALTH.CH26V113.0003
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch26.v113
    quote: 'In the event of the 10th Lord being placed in the 5th House the native will be
      endowed with all kinds of learning, be always cheerful, wealthy and be blessed with
      sons.

      Notes : According to this sloka an angle, the 10th House, gets related to a trine, the
      5th House. This combination, therefore, is specially auspicious. In it the native earns
      great fame on the basis of his intellectual powers and is very successful in his field
      of action. This combination is generally found in the horoscopes of wise statesmen,
      scholars, professors, writers, educationists, actors etc. In the Pisces Ascendant, the
      effects described in the sloka are obtained, by the native in their highest degree.
      Here is an example to prove the truth. The present Horoscope is of the world famous
      poet, Ravindra Nath Tagore, who got the famous nobel prize on his book ''Gitanjali''
      (A Garland of Songs). In this horoscope of Pisces Ascendant the 10th Lord Jupiter, being
      placed in the 5th House, is in his sign of exaltation. The fifth Lord, the Moon has
      exchange also with the Ascendant Lord Jupiter. Which very greatly increases the auspicious
      nature of this horoscope. The Second Horoscope is of Shivaji Ganeshan, a famous Indian
      Film Actor. He has been famous due to his art of acting. Here the 10th Lord Mars is
      situated in the 5th House.'
    quote_sha256: 267cee04e6e7fd23677ae5615c6f219f3a2caeb784df01237ddd01e6da273739
    authority_tier: S0
    extraction:
      method: converted
