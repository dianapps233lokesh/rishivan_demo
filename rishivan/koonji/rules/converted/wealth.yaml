- id: BPHS.WEALTH.CH15V9.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch15.v9
    quote: 'One of the objects of which Mars is the significator is the thief also. Therefore,
      when situated in the House of Profit Mars will make the native often a dishonest stealer
      of income tax. Such native does not honestly pay income tax to the government and is
      guilty of stealing it. In other ways also Mars is a malefic planet and does not have
      consideration of fair or foul means. In such condition, the native is bound to be guilty
      and liable to royal or governmental punishment.

      Like the Lord of the Sixth House Rahu is also a planet of Scarcity, poverty. It has
      been said of Rahu - “शनिवत राहु:” that is Rahu is like Saturn. Saturn is also the planet
      of scarcity or penury. According to ‘Uttara Kalamrita’ Rahu is the significator of heretics,
      gambling, lies and resort of the low born. It can be understood how the significator
      of these things will behave with regard to wealth when he is placed in the House of
      Wealth or the 2nd House. It is clear that the native’s wealth will have relation with
      such wicked and criminal actions as gambling etc. and with anti social activities which
      will be responsible to bring royal or governmental punishment on him.'
    quote_sha256: 8a6992363fcbf41c191894a6c86d9d5f4d7d5fd9509d5f1f10eef09fcbc1837c
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: mars_11th_house_tax_theft
    review:
      state: unreviewed
  when:
    occupies_bhava:
      subject: graha.mars
      bhava: bhava.11
  indicates:
    claim: wealth.accumulation
    polarity: negative
    magnitude: strong
    text: dishonest stealer of income tax or guilty of stealing it
