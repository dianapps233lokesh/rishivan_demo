- id: JATAKAPARIJATA.WEALTH.CH9V68.0002
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol1
    locator: ch9.v68
    quote: >-
      Sloka 68. When the Sun is in the सुख (Sukha 4th) bhava, the person born will suffer
      from heart disease, will lack money, corn and common sense and will be hard-hearted.
      If the Moon be in that bhava, the effect thereof is that the person born will possess
      learning, good nature and prosperity, but will hanker after other people's wives. The
      person born with Mars in the बन्धु (Bandhu 4th) bhava will be bereft of relations, and
      hen pecked, though valiant. If Mercury be in that bhava, the person born will be a forlorn
      creature without friends or relatives, while growing up to be a pandit distinguished
      for sterling knowledge and affluence.
    quote_sha256: 36046804074bdaf373f056b1a6aa19078a1db2e0fdcec6322a204358917b2000
    authority_tier: S0
    extraction:
      method: converted
