- id: BPHS.WEALTH.CH24V2.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch24.v2
    quote: 'When the 11th Lord is situated in the 11th House itself or in an angle or in a
      trine or he is exalted though in combustion, the combination will bring many gains to
      the native.

      Notes : The 11th Lord procures for the native many and special gains when he is situated
      in the 11th House or in an angle or in a trine from the Ascendant House. If he is exalted,
      even then the native gets full gains, though he may be in combustion. Here a noteworthy
      fact has been indicated. ''सूर्याशगोऽपि'' (Suryamshagoapi") may be interpreted as "even
      if the 11th Lord has gone into the Navamamsha of the Sun." Here the word ''ऽपि'' means
      यद्यपि (eventhough). The word ''अपि'' is used to express emphasis. Here also this word
      has been used for the sake of emphasis. Hence the meaning is : Even though the 11th
      Lord may be in combustion, in his exaltation sign he will procure for the native many
      and full gains.'
    quote_sha256: a54679368bf44f0203363397e5ea1e6fd5e4a2a14cf485e5ecaec60fdb77b466
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: labhadhipati_yoga_11th_in_11th
    review:
      state: unreviewed
  when:
    occupies_bhava:
      subject: lord.bhava.11
      bhava: bhava.11
  indicates:
    claim: wealth.accumulation
    polarity: positive
    magnitude: strong
    text: The native will obtain many gains
