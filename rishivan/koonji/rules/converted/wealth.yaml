- id: JATAKAPARIJATA.WEALTH.CH9V107.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol1
    locator: ch9.v107
    quote: >-
      Sloka 107. When the Sun is in the house of a friendly planet, the person born will have
      firm friends and will be liberal and famous ; when the Moon is in such a position, the
      person born will be esteemed, live in comfort and have wealth ; when Mars is in a friendly
      house the person born will enjoy the favor of rich friends; when Mercury is in that
      position, the person born will be most witty and jovial; when Jupiter occupies the house
      of a friendly planet, the person born will delight in the society of the learned and
      the virtuous ; when Venus occupies such a position the effect is that the person will
      be happy in the society of his children. If Saturn be in a friendly house at a person's
      birth, the latter will be fed by another as he will have no wealth.
    quote_sha256: 9ea9cbc5898a07072ee20b39d2902c4e4246f2018f4af5703f90b74514a2598a
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: 9.107.mars
    review:
      state: unreviewed
  when:
    dignity:
      subject: graha.mars
      dignity: dignity.friendly
  indicates:
    claim: wealth.accumulation
    polarity: positive
    magnitude: moderate
    text: person born will enjoy the favor of rich friends
