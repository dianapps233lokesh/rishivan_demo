    locator: ch49.v34-39
    quote: >-
      34-39-1/2: O Brahmin! Now I explain the signs etc., of Rahu and Ketu so that I can disclose
      the results of their Dasa before you. The exaltation signs of Rahu is Scorpio and for
      Ketu it is Taurus and the Moola Trikona signs are respectively Sagittarius and Gemini.
      Own sign of Rahu is Aquarius and of Ketu is Scorpio. Some have reckoned Virgo and Pisces
      signs respectively. If Rahu is exalted in the nativity, its Dasa will be extremely favourable
      and wealth, prosperity etc., is attained. Ambitions are accomplished through friends
      and king (Government), possibility of conveyance and son, construction of new residence,
      religious feelings, festivity, Royal recognition in the foreign land, decorative items,
      Jewellery etc., are also achieved. If Rahu is also aspected by and in conjunction with
      the benefic planets, posited in Angles, Trines the 11th or the 3rd house and with auspicious
      sign, property, land etc. and happiness is achieved with the blessing of king. Also
      recognition from the head of the family and welfare of house become possible.
    quote_sha256: 7057dabc8c846519e2afc51f289499e7bd4a95bd4cb02f83e0b88dbcd62f0002
    authority_tier: S0
    extraction:
