- id: BHAVARTHARATNAKARA.WEALTH.CH8V2.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: bhavartha-ratnakara
    edition: bhavartha-ratnakara-raman
    locator: ch8.v2
    quote: '2 The 2nd and 11th lords should be in the 10th free from affliction

      3 Rahu should be in the 10th 11th 4th, or 5th to confer Rajayoga in his Dasa

      4 Kethu''s presence in the 3rd is good but inauspicious in the 9th and 5th

      5 Sukra becomes capable of conferring power if he is in the 3rd with the Moon

      6 The native does not always wield power if the 10th lord is in the 3rd or the 11th
      but will do so only temporarily

      Illustrative of some of the combinations given above are the following charts — In Chart
      No 42 it will be seen that lord of the 2nd Mercury is in the 2nd and that of the 5th
      is in the 5th This has no doubt given rise to Rajayoga especially because Mercury the
      2nd lord is exalted But Jupiter''s association with Kethu going under the technical
      name of Guruchandalayoga has somewhat marred the Rajayoga Chart No 42 given above illustrates
      the Rajayoga mentioned in stanza 2 In Chart No 43 given herewith Jupiter is lord of
      the 2nd and 11th and he is in the 10th This is a very auspicious combination in as much
      as finance gains and means of livelihood are brought together so that all these three
      functions are promoted Guru Dasa in the case of the native of Chart No 43 has produced
      very beneficial results in respect of money, fame, profession and gains. This horoscope
      (Chart No 44) illustrates the principle adumbrated in stanza 3 that Rahu in the 10th
      house confers Rajayoga in his dasa Rahu by himself is not capable of giving rise to
      any results He gives the effects of the lords of Rasis which he occupies Consequently,
      in this particular chart Rahu must cause the result of Jupiter who as lord of lagna
      and the 10th lord is exalted in the 5th This is a unique combination which has made
      the subject a great figure in the field of poetry and literature According to Stanza
      6, if the 10th lord is in the 3rd the native does not always enjoy Rajayoga but will
      do so only temporarily In this horoscope (Chart No 45) the 10th lord Venus is in the
      3rd in his own house with Mercury lord of finance The native was once very well off
      and commanded much influence but now he is humble Mark the Dwirdwadasa positions of
      planets Stanza 7 is rather vague It says that if Jupiter as 10th lord (which is possible
      in case of Mithuna and Meena Lagnas) is in the 3rd, he would give rise to the same yoga
      as he would do, if he were lord of the 3rd What results Jupiter would give as lord of
      the 3rd the author has not elucidated We have to take the information from other books
      Stanza 8 If the 9th lord is in the 8th, his Dasa will not confer any fame If Jupiter
      as lord of the 9th is in the 8th the person becomes highly fortunate This is an important
      stanza not only as enunciating a general principle but as pointing out an exception
      Thus the 9th lord in the 8th is not good But Jupiter is an exception In our humble experience
      we have found that if Jupiter, even without being lord of the 9th, is in the 8th the
      native enjoys much wealth But such Jupiter should be lord of Lagna The following horoscope
      (Chart No 46) illustrates this principle The Lagna is Dhanus and the lord Jupiter is
      exalted in the 8th There are of course several other good combinations but this one
      has made the native amass much fortune Stanza 9 If the 8th and 9th lords are in conjunctionor
      aspect each other, fame and power will be conferred in the Dasa of the 8 lord This combination
      is to be found in Chart No 46 given above The Sun and the Moon—lords of 9th and 8th
      respectively aspect each other so that the Moon''s Dasa will confer fame and prosperity
      on the native Stanza 10 If the 9th and 8th lords combine with or aspect each other fame
      and power will be conferred not in the Dasa of the 9th lord but in the sub-period of
      the 8th lord In stanza 9, it is stated that the 8th lord gets the power to produce yoga
      which means the 9th lord delegates his power to the 8th lord with the result he himself
      becomes powerless Stanza 11 If the 10th and 11th lords combine with or aspect each other
      Rajayoga will be caused in the Dasa of the 11th lord Stanza 12 If the 10th and 11th
      lords combine with or aspect each other, good and bad results will be equal during the
      Dasa of the 10th lord Stanza 13 The person will be deprived of fame and prosperity in
      the sub-period of the 11th lord When Venus is in the 10th no yoga will be produced in
      his Dasa Rajayoga will be conferred in Sani Dasa if Sani is in the 7th house In Chart
      No 47 note lord of the 10th aspects the lord of the 11th while from Chandra Lagna lords
      of the 10th and 11th aspect each other mutually The native has been enjoying Rajayoga
      in the Dasa of Jupiter lord of the 11th (stanza 11) The principle given out in stanza
      13 that the sub period of the lord of the 11th would deprive the native of Rajayoga
      is applicable in toto to the above example In the sub period of Jupiter (in the Dasa
      of Guru) the native lost fame and money and his reputation was at stake for no fault
      of his There was a clear break in the Rajayoga Stanza 14. Rahu in the 7th will certainly
      confer fame and prosperity. Saturn in the 3rd and 9th will also confer yoga. Stanza
      15 Jupiter in the 3rd, 8th and 9th will confer fame and prosperity. The person goes
      to heaven after death if Jupiter is in the 12th. Stanza 16. If the 9th and 10th lords
      are in the 10th and 9th respectively the native will enjoy Rajayoga and much fame. The
      yogas mentioned in stanzas 14 and 15 are simple enough Contrary to the commonly accepted
      notion that Saturn destroys the bhava he occupies, the author holds that Saturn in the
      9th confers yoga. But readers will have to note that such a situation of Saturn would
      adversely affect the father. The 12th represents moksha or emancipation As Jupiter is
      a Deva planet, his situation in the 12th takes the person to heaven after his death.
      The combination given in stanza 16 goes under the name of Dharmakarmadhipa yoga or exchange
      of houses between 9th and 10th lords and it is an auspicious combination Though it may
      not give much fame it will certainly confer prosperity and wealth In this horoscope
      (Chart No. 48) lord of the 9th Mercury is in the 10th while the 10th lord Venus is in
      the 9th. Though Venus is Neecha, he is free from Neecha effect. The native is very well
      off in life and enjoys much prosperity Stanza 17. If the 9th lord is in the 10th and
      the 10th lord is in the 9th the native enjoys much fame and power. This is merely a
      repetition of stanza 16 in a different form and is quite unnecessary. Stanza 18. The
      person enjoys much fame and power if the 9th lord is in the 9th and the 10th lord is
      in the 10th. Stanza 19. Power and fame are conferred if the 10th and 5th lords are in
      the 10th and 5th. Stanza 20 Power and fame are conferred if the 9th and 10th lords are
      in the 7th and 1st houses respectively Stanza 21. If the 6th, 7th and 10th lords are
      situated in quadrants or trines, the person enjoys power and much fame Stanza 22. Rajayoga
      is caused if the Sun is in Aries, Jupiter and the Moon are in Cancer, Saturn is in Libra
      and Mars is in Capricorn. Stanzas 18 to 20 inclusive suggest the combinations which
      confer Rajayoga. Such combinations are to be found in almost all horoscopes of any pretence
      to power. The 10th, 9th, 5th, 7th and 1st houses are taken into account and certain
      dispositions of these lords are said to confer Rajayoga. It is not clear as to why the
      6th lord is given importance along with the 7th and 10th lords in stanza 21. Probably
      the 6th lord will lose the evil of 6th lordship if he is in a kendra or thrikona but
      still the evil will be there and it will manifest in some shape in the period or sub
      period of the 6th lord. The combination given in the last stanza is to be found in very
      rare and exceptional cases as for instance in the horoscope of Sri Rama The Moon and
      Jupiter are in Cancer The Sun is in Aries, Saturn is in Libra and Mars is in Makara
      thus causing a very powerful Raja yoga The same combination will be found in the horoscopes
      of several well known Emperors of Puranic fame Stanza 1 If Jupiter is combined with
      or aspected by the lord of the 10th the native will be engaged in good deeds

      Stanza 2 If the lords of the 7th 5th 9th Jupiter and 10th are all combined in an aquatic
      sign (Jalarasi)

      Stanza 3 the native will have dips in rivers as sacred as Ganges but not in Ganges

      Stanza 4 No pilgrimage will be undertaken in the Dasas of the 5th and 7th lords The
      native will devote himself to listening to the stories of Vishnu

      Stanza 5 A person born in Mithuna Lagna will certainly have dips in Ganges in the Dasas
      of Jupiter and Saturn if they are in the 9th house

      Stanza 6 A person born in Mesha Lagna will bathe in Ganges in the Dasas of Venus Jupiter
      and the Sun if they are in the 10th house Stanza 7. If the 10th lord is combined with
      Jupiter the native will be highly religious or orthodox. If the 10th lord is in the
      6th or 12th he will not be religious. That a separate chapter should be devoted to giving
      combinations for bathing in sacred rivers shows the importance which the Hindus have
      attached from time immemorial to the question of pilgrimage. Careful study reveals that
      pilgrimage to which a religious touch was given was undertaken as part of education.
      Pilgrimage is the final phase of education and it has its own moral, intellectual and
      social values. The waters of Ganges and several other sacred rivers are full of medicinal
      virtue and a dip in these rivers is held so sacred that it washes not only the physical
      dirt but the mental impurity also. Even now, the majority of the Hindus or for that
      matter people of all religions yearn to undertake pilgrimages so that their existence
      on the earth might be justified. The first stanza says that if the 10th lord and Jupiter
      are conjoined together or aspect each other the native will be engaged in Satkarmas
      or good deeds. Jupiter is the Guru or preceptor of the Gods and as the 10th is the house
      of action, Jupiter''s connection with it or its lord is bound to have very favourable
      influences. Human nature takes different moulds. There are people who are always for
      destruction, wicked acts, selfishness and engaged in dirty and scandalous things. Jupiter
      in the 10th generally counteracts this evil influence and makes the native fear God
      and hate injuring others, detest evil company and engage himself in charitable acts
      and deeds. In Chart No. 50 Jupiter—the Karmakaraka is in the 10th. In Jupiter''s Dasa
      in his own bhukthi the native had dips in not only the Ganges but also in other sacred
      rivers and visited a number of holy places. Thus ends the Ninth chapter entitled Rajayogas
      in Bhavartha Ratnakara of Sri Ramanujacharya. Stanza 1. The 2nd lord becomes a Maraka
      in the Dasa of the 12th lord. The 12th lord becomes a Maraka in the Dasa of the 2nd
      lord Stanza 2. If the 12th lord is aspected by or is in conjunction with the 2nd lord,
      he becomes a powerful maraka in his Dasa . Stanza 3. The planets in the 12th house which
      are aspected by the 12th lord become powerful marakas during the Dasa of the 2nd lord.
      Maraka or death is an important event in the life of an individual I have dealt with
      this question fairly exhaustively in my books Hindu Predictive Astrology and How to
      Judge a Horoscope. The ancient seers have given a number of methods—mathematical as
      well as predictive for finding the duration of life of an individual As far as my humble
      experience goes, the mathematical methods have their own pitfalls and do not seem to
      yield correct results in the majority of cases The predictive processes on the other
      hand, if handled properly by an expert who has developed intuition will be very helpful
      in finding the time of death. Whatever be the combinations given for finding the maraka
      planets one should first ascertain, whether a horoscope in question indicates Balarishta
      (early death), Alpayu (short life Madhyayu (middle life) or Purnayu (full life) Generally
      speaking if the majority of the planets are disposed in Kendras or quadrants, one will
      have long life if in Panaparas (cadent houses) middle life and if in Apoklimas (succeedent
      houses) short life This is only a general principle and it should be applied with great
      care There are well known principles which will enable any reader of average intelligence
      to judge the kind of Ayurdaya, and they can be studied from any standard book. The author
      of this work, Sri Ramanuja has given beautiful combinations According to him —'
    quote_sha256: bc5224952f6f5dec4d6108b72f5478e3173e9fc3dae7c6fc2111e1df16aa16b5
