    quote: >-
      Sloka 50. When the lord of the 3rd bhava occupying the 10th or the 4th ( ? ) is in a
      benefic sign and in conjunction with a benefic planet, the person born will get an article
      of attire incomparably beautiful. If a benefic planet be in the 3rd bhava, his wearing
      apparel will be of a superior kind. Venus and the lord of the 3rd bhava when possessed
      of abundant strength produce abundant clothing and decoration ; when associated with
      or aspected by Mercury and Jupiter, they secure the advantages of listening to sweet
      discourses on religion and morality.
