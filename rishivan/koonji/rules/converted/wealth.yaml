    quote: >-
      Sloka 94. The person at whose birth the Sun is in the 11th bhava, will have extensive
      wealth, wife, children and slaves and will be happy, when the Moon is in that bhava,
      the person born will be of a pensive disposition and wealthy, when Mars occupies the
      आय (Aya, 11th) bhava at a person's birth, he will be clever in speech, lustful, wealthy
      and valiant, when the occupant of the 11th bhava is Mercury, the person born will possess
      an acute intellect, be famed for his learning and in possession of wealth
