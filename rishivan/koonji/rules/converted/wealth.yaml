    quote: >-
      When Kuja is in the 4th (Cancer) with Jupiter the former becomes quite capable of conferring
      Yoga. When Kuja is in the 4th for a person born in Mesha, the planet becomes debilitated.
      If Jupiter is in Cancer, where he will be exalted, the Neecha effect of Kuja is cancelled
      with the result, Lagnadhipathi is subject to a distinct Neechabhanga Raja Yoga. In all
      these cases Kuja seems to confer more of fame than of material possession or wealth.
      Humble as my experience has been, I have always found Kuja making the native famous
      rather than rich.
