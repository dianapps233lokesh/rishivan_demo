- id: BPHS.WEALTH.CH26V127.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch26.v127
    quote: 'If the 11th Lord is situated in the 7th House, the native always gains through
      his wife’s relatives. He will be liberal, virtuous, sensual and will remain at the command
      of his wife.

      Notes : If the Ascendants are Aries and Libra, the 11th Lords will be respectively Saturn
      and the Sun. Being placed in the 7th House both they will be in their signs of exaltation.
      Therefore, the native will have special gains from his wife’s relatives. Such a native
      is generally married in a rich family. In the Gemini Ascendant the 11th Lord Mars will
      be the 6th Lord also. The 6th House is the House of enemies, oppositions and disputes.
      Therefore, a native having this combination will certainly face opposition from his
      wife. One of the reasons of opposition between wife and husband may be relating to dowry.

      In the Leo and Aquarius Ascendants the 11th Lords will be respectively Mercury and Jupiter.
      They will be the Second Lords also. Therefore, both the planets who are the representatives
      of value will be in the 2nd and 11th House which also represent value. A native having
      this combination in his horoscope has special gains of wealth from his wife’s relatives.
      His wealth increases greatly after marriage.

      In the Capricorn Ascendant the native doesnot get happiness through his wife for a long
      time because in this Ascendant the 11th Lord Mars will be debilitated in the 7th House
      and he will soon cause the death of the native’s wife. Some natives get their engagements
      broken.'
    quote_sha256: 504a6d0d038bee357e23678993338659b5cae6f08c8311aac61e636b49e5cee7
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: 26.127.1
    review:
      state: unreviewed
  when:
    occupies_bhava:
      subject: lord.bhava.11
      bhava: bhava.07
  indicates:
    claim: wealth.accumulation
    polarity: positive
    magnitude: moderate
    text: the native always gains through his wife's relatives
