      subject: graha.moon
      other: graha.saturn
  indicates:
    claim: wealth.accumulation
    polarity: negative
    magnitude: moderate
    text: will be without wealth
- id: JATAKAPARIJATA.WEALTH.CH9V450.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol1
    locator: ch9.v4-50
    quote: >-
      Sloka 50. When the Moon in Thula is aspected severally by the benefic planets, Mercury,
      Jupiter and Venus, the persons born in the several cases will be respectively a king,
      a mint-master and a merchant. If the Moon in Thula be aspected severally by Mars, the
      Sun and Saturn, the person born in each case will be impotent. If the Moon occupy the
      sign Scorpio and be severally aspected by the planets taken in order from Mercury, the
      person born in the several cases will be (1) a man with two fathers and two mothers
      (2) a favorite of the king, (3) a mean-wretch, (4) a sickly person, (5) a poor man,
      (6) and a minister of a king. वञ्चक (Vanchakaha) is another reading for षण्डक (Pandakaha)
      in the 2nd pada of the sloka
    quote_sha256: 02988c02c76d2e5de923119bd96292cc2dbded12d83a3868c428d5d35a80d8e3
    authority_tier: S0
