- id: JATAKAPARIJATA.WEALTH.CH9V13.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: jataka-parijata
