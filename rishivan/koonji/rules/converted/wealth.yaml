- id: BRIHATJATAKA.WEALTH.CH17V12.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: brihat-jataka
    edition: brihatjataka-row-1919
    locator: ch17.v12
    quote: '12 Moon in Pisces—enjoying others wealth and aquatic articles, fond of wife and
      clothes, well proportioned and handsome body prominent nose big head, conquering enemies
      submissive to women charming eyes enjoying treasure trove, lustrous articles, wealthy
      and learned When the Moon the sign in which he is and its Lord are powerful the results
      indicated above will be fully verified. The other planetary results must be similarly
      suggested The Moon at the time of birth occupies a zodiacal sign and this is technically
      called the janmarasi Moon is identified with the rising constellation at the time and
      will be moving there If the Moon is strong as well as the house and its lord he occupies,
      the results predicted will be completely visible But when two of them are powerful they
      will be partly visible When one is powerful there will be traces of these characteristics.
      But when all of them are weak, then there will be no traces even of the qualities named
      in the respective places The author is now going to relate the results from the occupation
      of other planets in the various houses of the zodiac and desires the readers to judge
      of them on the lines of argument suggested here As the results of the occupation of
      the Moon in the 12 zodiacal signs are clearly given in simple language, I do not think
      any further notes in this connection are wanted in the 1st 9 degrees and-from the 11th
      to the 30th degree inclusive he is said to be in exaltation in Aries When he is in deep
      exaltation, the Sun will make the man very famous clever, wealthy and commander of men
      bearing arms So much is not in the original but Bhatotpala rightly adds in his commentaries
      the results above sketched getting his information from other valuable sources When
      the Sun is not in his deep exaltation in Aries the person will become famous clever
      traveller, possessed of little wealth and bearer of arms When the Sun is in Taurus the
      person will sell scents and clothes, hate females and be clever in drumming and music
      Aries extends over 30 degrees of the zodiac and in its 10th degree the Sun is in Swatunga
      or deep exaltation But When the Sun is in Gemini the native becomes educated, astrologer
      and wealthy In Cancer he makes the native angry, poor, doing others work, and suffer
      from fatigue by travelling and other cares In Leo the Sun causes love in forests mountains
      and cattle courageous and dull When the Sun is in Virgo, the person becomes skilful
      in writing, painting, poetry, philosophy and mathematics, and possesses a feminine body
      When the Sun occupies Libra he makes the man a toddy-seller, drunkard, traveller, goldsmith
      and mean When the Sun is in Scorpio he makes the man cruel, adventurous and rash, making
      profits by sales of poisonous substances losing wealth by robbers, and skilled in military
      weapons, and destroyer When the Sun is in Sagittarius the person will be respected,
      rich, angry, doctor and artisan When the Sun is in Capricornus the person will be mean,
      ignorant seller of low articles, little wealth, covetous and enjoying at others cost
      The Sun in Aquarius makes a man mean, separated from children and wealth and poor. The
      Sun in Pisces causes wealth through articles found in water and fondled by women When
      the Sun and the Moon are combined in a Rasi marks or moles in the organ which is governed
      by Kalapurusha, are governed. the person will have a mole or mark on the head If they
      are in Scorpio the mark will be on the sexual organ Mars in Aries and Scorpio—Respected
      by Kings, traveller, commander, merchant, rich, cut or scarred body, thief, running
      through various sense pleasures or objects


      Mars in Taurus and Libra—Submissive to women, ungrateful friend, fond of others wives,
      cheat, fop, timid and unsocial Mars in Gemini and Virgo—jealous, sons, friendless, grateful,
      clever in music and martial work, miserly, undaunted and mendicant


      Mars in Cancer—rich, wealth procured through ships or through travelling, intelligent,
      wanting in organs and cruel. Mars in Leo—poor, enduring, travelling in forests, few
      children and wife.'
    quote_sha256: 895e47962ca90936016d4e94b82f7aef9a0d11bb12e4ba69c528aba4ab02b592
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: moon_in_pisces
    review:
      state: unreviewed
  when:
    occupies_rashi:
      subject: graha.moon
      rashi: rashi.pisces
  indicates:
    claim: wealth.accumulation
    polarity: positive
    magnitude: moderate
    text: enjoying others wealth and aquatic articles
