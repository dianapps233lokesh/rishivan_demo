    quote: >-
      Placement of Ketu duly conjunct with the malefic planets at the 6th, the 8th or the
      12th house from the lord of the Mahadasa (Mars), there will be quarrels, dental problem,
      trouble through thief, lion etc., fever, dysentery, arthritis, bickering with wife and
      children etc. If Ketu is posited in the 2nd or the 7th house from the Ascendant, mental
      agony, destruction of wealth and food grains will be caused.
