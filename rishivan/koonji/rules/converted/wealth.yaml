    quote: >-
      Sloka 65. When the Sun is in the 3rd bhava, the person born will be brave, served by
      bad men, very wealthy and liberal; when the Moon occupies the bhava representing younger
      brothers, the person born will have insignificant wealth, be kind to relatives and virtuous
      With Mars in the 3rd bhava, the person born becomes famous, of immense prowess, and
      of upright (uncrooked) views, but when Mercury occupies the 3rd bhava, the person born
      is bent on the practice of deception, of vagrant habits, excessively vacillating and
      miserable
