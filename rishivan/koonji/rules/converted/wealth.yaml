      the Dasa of such Moon, there will be gain in wealth. In case, the powerful Moon is in
      the 3rd house, fluctuating effects, at times, comforts and at time, gain in wealth are
      felt. Having conjunct with the malefic planets, the weak Moon sets in sluggish feeling,
      mental derangement, trouble in service, loss of wealth and intense trouble (death like)
      from the maternal relations. If the same weak Moon is posited in the 6th, the 8th or
      the 12th house, (Trik Houses), blame from the authorities (King), mental tension, loss
      of wealth and health, conflict with mother, enertness, mental depression etc., will
      also cause during the Dasa. If the Moon is posited in Trik houses (6th, 8th or 12th)
      but powerful, mixed results of gain in wealth, happiness or bodily pains etc., will
      be felt intermittently.
