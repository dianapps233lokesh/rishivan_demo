- id: BPHS.WEALTH.CH58V4344.0006
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.wealth: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch58.v43-44
    quote: >-
      43-44½: If Venus is placed at the 6th, the 8th or the 12th house from the Ascendant
      or the Mahadasa lord in the sign of debilitation, it will give rise to disputes, opposition
      with the co-borns and sufferings of wife and children. If this Venus conjoins with Saturn
      or Rahu, quarrels; fear of persecution by the king, dispute on account of wife; conflict
      with father-in-law, differences with the brothers and loss of wealth and prosperity,
      would be the results of the Antardasa of Venus.
    quote_sha256: 25250f47d19af1c17638eaedae183aec101171c5613d6374f4ad3239f4d39891
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: '58.43_2'
    review:
      state: unreviewed
  when:
    all:
    - any:
      - occupies_bhava:
          subject: graha.venus
          bhava: bhava.06
      - occupies_bhava:
          subject: graha.venus
          bhava: bhava.08
      - occupies_bhava:
          subject: graha.venus
          bhava: bhava.12
    - not:
        conjunct:
          subject: graha.venus
          other: graha.saturn
    - not:
        conjunct:
          subject: graha.venus
          other: graha.rahu
  indicates:
    claim: wealth.accumulation
    polarity: negative
    magnitude: moderate
    text: loss of wealth and prosperity
