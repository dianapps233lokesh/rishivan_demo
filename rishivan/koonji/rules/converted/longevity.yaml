- id: PRASNAMARGA.LONGEVITY.CH16V1.0001
  version: 1.0.0
  status: candidate
  school: school.prashna
  assertion: assert_claim
  domains:
    domain.longevity: 0.7
  source:
    book: prasna-marga
    edition: prasnamarga-raman-part1
    locator: ch16.v1
    quote: 'Lords of Lagna and the 8th should be inimical.

      2. Lords of Chandra Lagna and the 8th from it should be enemies.

      3. Lord of the Navamsa occupied by Chandra and the lord of the 64th from Chandra Navamsa
      should be enemies.

      4. Lord of Lagna and the Sun should be enemies. The four pairs listed above should be
      neutrals. The four pairs should be friends.

      Suppose the Moon, in Navamsa, is in Leo. The lord is Sun. The 64th Navamsa from the
      Moon''s Navamsa would be Scorpio and the lord is Mars. The Sun and Mars are friends.
      Relationships should be considered in this way. Stanzas 62 to 65. — The Lagna and Chandra
      Lagna are strong; are occupied or aspected by benefics; benefics are in quadrants, trines,
      2nd and 8th; malefics are disposed in the 3rd, 6th and 11th; Jupiter rises in Lagna;
      Jupiter and the Moon are in association; and the lord of Lagna is in a kendra ; the
      lord of Chandra Lagna is strong. Lagna lord occupies the 11th from Lagna. The above
      combinations confer long life.

      NOTES

      Wherever Lagna is mentioned in the above stanzas, Chandra Lagna should also be considered.
      Combinations for long life given in stanzas 62 to 65 may be listed thus: —

      (1) Lagna is strong. (2) Chandra is strong. (3) Lagna is aspected by good planets. (4)
      Chandra is aspected by good planets. (5) Lagna is occupied by good planets. (6) Chandra
      is conjoined with good planets. (7) Good planets should occupy quadrants, trines, the
      2nd and 8th houses. (8) Good planets should occupy quadrants, trines, 2nd and 8th houses
      from Chandra. (9) Evil planets should occupy 3rd, 6th and 11th from Lagna. (10) Evil
      planets should occupy 3rd, 6th and llth from Chandra, (11) Jupiter in Lagna. (12) Jupiter
      and the Moon are in one Rasi. (13) The lord of Lagna is in a kendra from Lagna. (14)
      The lord of Chandra Lagna is in a kendra from Chandra Lagna. (15) The lord of Lagna
      is strong. (16) Lord of Chandra Lagna is strong. (17) The lord of Lagna occupies the
      llth house from Lagna. (18) The lord of Chandra Lagna occupies the llth house from Chandra
      Lagna. These are the 18 yogas indicating long life. Stanzas 66 to 73. — The Lagna and
      the Moon are weak; they have evil aspects or associations ; lords of Lagna and Chandra
      Lagna are combust; they are in the 6th, 8th or 12th; birth takes place when the Sun
      or the Moon is surrounded by a halo or when there is an eclipse, or at twilight, or
      at the time of earthquakes or other evil omens or in the Mrityubhagas of Rasis or Rasi
      Sandhis; Chandra occupies Mrityubhagas in kendra Rasis or the 8th from Lagna; Chandra
      is in the 6th or 8th aspected by planets; benefics occupy the 6th or 8th aspected by
      retrograde malefics; evil planets are in kendras, trikonas or in the 8th. The above
      combinations indicate short life.

      NOTES

      Combinations for short life are listed in these stanzas. Chandra Lagna has been given
      equal prominence with Lagna. The Mrityubhagas or fatal degrees are the 1st, 9th, 22nd,
      23rd, 25th, 2nd, 4th, 23rd, 18th, 20th, 24th and 10th in Aries onwards in regular order.
      Chandra Mrityubhagas, i.e., the degrees considered fatal for the Moon are 26th, 12th,
      13th, 25th, 24th, 11th, 26th, 14th, 13th, 25th, 5th and 12th in Aries, etc. According
      to stanzas 66 to 73, short life is indicated: — (1) If Lagna is weak. (2) If Chandra
      is weak. (3) If Lagna is associated with bad planets. (4) If Lagna is aspected by bad
      planets. (5) If Chandra is conjoined by bad planets. (6) If Chandra is aspected by bad
      planets. (7) If the lord of Lagna is in combustion. (8) If the Lord of Chandra Lagna
      is in combustion. (9) If Lagnadhipa occupies 6th, 8th and 12th houses from Lagna. (10)
      If Chandra Lagnadhipa occupies 6, 8, 12 from Chandra Lagna. (11) If Chandra Lagnadhipa
      is weak. (12) When the Sun or the Moon is surrounded by a halo (Parivesha) and is eclispsed.
      (13) If birth takes place in Saadhyas. (14) Dikdaha or earthquakes or Ulkapatha take
      place at the time of birth. (15) If birth takes place in the Mrityubhagas of Rasis.
      (16) If born in Rasi Sandhyas. (17) If the Moon occupies the Mrityubhaga of kendras
      and the 8th house from Lagna. (18) If Chandra occupies kendras or 8th house or Mrityubhagas
      in conjunction with evil planets. (19) If Chandra occupies the 6th or 8th house aspected
      by any planet. (20) If good planets occupy 6th or 8th house aspected by evil planets
      with retrograde movement. (21) If evil planets occupy the kendras and trines and the
      8th house. Thus there are 21 yogas. Stanza 74. — If there are more yogas for long life,
      long life is to be predicted. If there are more yogas for short life, short life is
      to be expected. If the yogas are found mixed, the intensity and strength of these yogas
      should be examined and then the prediction given. Stanza 75. — If after examining Prasna
      and Jataka, it is found that the questioner will die, by what diseases and when he will
      die, should be predicted. If he has a long life, when his recovery will begin should
      be ascertained. If there are any doubts, the Thrisphutas also should be examined and
      the indications for death and recovery determined. These should be well balanced. Here
      ends the examination of life with the help of a horoscope. Stanza 1. — The question
      of death should be examined from the birth and horary charts. In order to ascertain
      the nature of death, its cause and the time of its occurrence, the yogas, the nature
      of Dasas and the nature and positions of Saturn, Jupiter, the Sun arid the Moon should
      all be first studied. Stanza 2. — Death takes place at the end of the period indicated
      by Yogayus. Sometimes the age as contributed by Dasas goes counter to the age given
      by yogas. This should be carefully understood. Stanza 3. — In the absence of any yogas
      in the horoscope indicating age, we have to be guided by the Dasas and determine the
      period of death. From this we see that ''Dasayus'' is very important. But ''Yogayus''
      is no less \aluable. Certain yogas as Sadhyorishta, Arishta. etc., are not said to be
      controlled by Dasas. Certain yogas as Rishta-Yogas, Madhyayus or Deer-ghayur yogas are
      to be checked by the age contributed by Dasas and Bhuktis. If Yogayus indicates, say
      75 years, and according to Dasas also the same age is obtained, then one can boldly
      declare the length of life. Stanza 4. — Death can happen in the Dasa or Antardasa of
      the weakest — that which occupies the 6th, 8th, 12th or that which is associated with
      or aspected by malefics of the following: Lords of 8th from Lagna and the Moon; planets
      occupying or aspecting the 8th from Lagna and the Moon; Saturn; lords of the 22nd Drekkana
      from Lagna and the Moon; lord of the house occupied by Gulika; lords of the houses and
      Navamsas occupied by these factors; and Rahu. An exhaustive list of marakas is furnished
      in this stanza. Wherever Lagna is mentioned, Chandra Lagna is automatically meant. A
      discriminating astrologer should very carefully pick out the appropfiate maraka. Of
      all these lords, the weakest — by occupying 6th or 8th house or subject to affliction
      — should be selected. The marakas can be listed thus:

      1. The lord of the 8th house from Lagna.

      2. The lord of the 8th house from Chandra.

      3. The planets that occupy the 8th house from Lagna.

      4. The planets that occupy the 8th house from Chandra.

      5. The planets that aspect the 8th house from Lagna.

      6. The planets that aspect the 8th house from Chandra.

      7. Saturn. 128'
