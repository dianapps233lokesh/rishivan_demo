    quote: >-
      In the Mahadasa of the Sun, if Venus is placed in the 6th, the 8th or the 12th house,
      or devoid of strength, the result of the Antardasa will be persecution by the King,
      mental conflicts, loss of wealth, wife or children etc. In the beginning of Dasa, the
      results will be of medium intensity; in the middle of the Dasa, native gains wealth
      and other auspicious effects; in the end of Dasa loss of fame, destruction of place,
      hatred from friends, loss of comforts etc. Venus being in the 7th house will inflict
      bodily pains and fear of some disease. Placement of Venus in the 8th or the 12th house
      will cause early death. In order to neutralize the ill effects, Mrityunjaya Mantras
      should be recited, pious donations of white cow or buffalo (female) and Lord Shiva Japa
      be performed. By undergoing penance of this kind, peace and tranquillity will prevail
      with the blessings of Lord Shiva.
