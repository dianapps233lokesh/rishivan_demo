- id: HINDUPREDICTIVE.LONGEVITY.CH14V6.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.longevity: 0.7
  source:
    book: hindu-predictive
    edition: hindupredictiveastrology-raman
    locator: ch14.v6
    quote: 'Jupiter in the Lagna, Venus in the 4th and Saturn and the Moon in the 10th make
      a person live for a long time. After ascertaining to which class a particular horoscope
      belongs, the marakas or the death-inflicting planets must be determined and the death
      predicted under the dasas of such planets. MARAKAS are planets possessed of the power
      of inflicting death. Death generally occurs during the periods and sub-periods of such
      planets. Suppose, a horoscope indicates middle life or Madhyayu whereas the dasa of
      a most powerful maraka comes into operation after 80 years. In such a circumstance the
      period of a planet, no matter even if it is less malicious in causing death which comes
      within the maximum number of years allotted for Madhyayu, must be determined as bringing
      about death, in preference to the most malicious one. Ascertain beforehand, whether
      a horoscope indicates short, middle or long life ; determine the maraka planets and
      the times when their influences will come to fruition. The 8th house from lagna (ascendant)
      and the 8th from that, i.e., the 3rd from lagna are termed as houses of life. The 7th
      house and the 2nd house are called houses of death. The 2nd house is always stronger
      in inflicting death than the 7th. Planets who occupy the 2nd are stronger than the planets
      who own it, intending to cause death and the planets who are in association with the
      lord of the 2nd are the most powerful in causing death. Thus the lords of the 2nd and
      the 7th, their occupants and the planets who are in conjunction with them are the Maraka
      planets. If marakas cannot be found out of these three, then the planet in conjunction
      with the lord of 12th, even if it is a benefic, causes death in his dasa (period) in
      the bhukthi (sub-period) of a papa (malefic) if he is the lord of the 3rd or 8th house.
      If the dasa of Vyayadhipathi (lord of the 12th) does not come then one most powerful
      among the lords of the 3rd, 6th and 8th becomes maraka. If the Sun and Sukra (Venus)
      are lords of the 2nd and 7th or get Kendradhipatya (lordship of quadrant)--they are
      sure to become marakas. Summarising the above:--Death will be caused by:

      1. Planets who occupy the 2nd and 7th houses.

      2. Planets who are lords of the 2nd and 7th houses.

      3. Planets who are not owners of 2nd and 7th houses, and who are not occupying those
      houses but who join with the lords of those houses, i.e., 2nd and 7th.'
    quote_sha256: 2cf95623856496329df95d528c3c9c50203420564646b977e41d1e246a42a531
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: longevity_yoga_1
    review:
      state: unreviewed
  when:
    all:
    - occupies_bhava:
        subject: graha.jupiter
        bhava: bhava.01
    - occupies_bhava:
        subject: graha.venus
        bhava: bhava.04
    - occupies_bhava:
        subject: graha.saturn
        bhava: bhava.10
    - occupies_bhava:
        subject: graha.moon
        bhava: bhava.10
  indicates:
    claim: longevity.span
    polarity: positive
    magnitude: strong
    text: The native will live for a long time
