- id: BPHS.SPIRITUAL.CH82V2629.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  domains:
    domain.spiritual: 0.7
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch82.v26-29
    quote: >-
      If the Sun be posited in the 8th house in the horoscope of a female, the woman remains
      in distress and faces poverty. She will have a deformed limb (or suffers from ulcer)
      and irreligious. If the Moon be in the 8th house, she will have defective vagina, deformed
      breasts and repulsive eyes. She will be bereft of clothes (decent) and ornaments, will
      be diseased and criticised by others. If Mars is posited in the 8th house, that woman
      will be of weak physique, sickly, widow, not beautiful and will face destitution and
      distress. The position of Mercury, in the 8th house, she will be irreligious, remain
      frightful, deprived of wealth, pride, good qualities and will be quarrelsome.
    quote_sha256: 04cfc74de07dc06d4380176072440eeddab638f748f1e67403d554d292013a4d
