    quote: >-
      Sloka 15. The refuge of the departed is the lord of the Drekkana of the 6th house (i.e.,
      the 16th decanate from the rising decanate) or of the 8th house (i.e., the 22nd decanate
      from the rising decanate) or the planet occupying the 7th bhava (Bhattotpala adds the
      6th and the 8th bhavas also). Whichever of these planets is found to be strongest, to
      the world thereof does the departed person go. If Jupiter is in his exaltation and occupies
      the 6th bhava, a Kendra position or the 8th bhava, the departed person will attain final
      emancipation. The same happens also if the rising sign is Pisces and the rising Navamsa
      is that of a benefic planet and Jupiter occupies it, while planets other than Jupiter
      are without strength रिपुरन्ध्रत्र्यंशाप (Ripurandhratryamsapa) may also be interpreted
      as the ruler of the decanate of the 6th or the 8th bhava counted from the 7th, i.e.
      of the 12th or of the 2nd bhava. (This agrees with the western view that the 12th and
      2nd houses indicate future births and the 6th and the 8th indicate past birth) Planets
      placed in the 7th will indicate also future birth Exceptions. Exalted Jupiter in the
      6th, the 8th or in a Kendra position will make the native attain bliss. If Pisces be
      rising in a Navamsa of a benefic, it leads to bliss. In the above two exceptions, the
      other planets must not be powerful as Jupiter. N.B.—Bliss मोक्ष (Moksha) is higher than
      देवलोक (Devaloka). This is clearly hinted by Varahamihira talking of Moksha (मोक्ष)
      as distinct and quite apart from the slokas containing देवलोक (Deva loka), पितृलोक (Pitruloka),
      etc.
