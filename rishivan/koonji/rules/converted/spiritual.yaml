    quote: 'The sub-period of the lord of the 5th in the major period of the lord of the 9th
      or vice versa is supposed to produce good effects. The Dasa of the Sun in Aries in Deep
      Exaltation :- Sudden gains in cattle and wealth, much travelling in eastern countries,
      residence in foreign countries, quarrels among friends and relations, pleasure trips
      and picnic parties and company with and enjoyment of beautiful and lovely women. Moolathrikona
      :--Birth of children, much respect from high personages, gains in cattle and money,
      acquisition of power and political success. Taurus :--Increase in landed properties,
      fame among relations and friends, cultivation of love and reverence for holy people
      and saints. Gemini :--Much wealth, education, inclination to interest himself in music
      and such other fine arts, and always happy and cheerful. Cancer :--Political success,
      always gay and happy, travelling in foreign countries and increase in lands, houses
      and wealth. Leo :--Respect from kings and noble personages, righteous conduct, birth
      of children and respect among children. Virgo :--Continuously suffering from serious
      physical diseases, loss in cattle, wealth and house and misunderstandings with nearest
      and dearest people. Libra :--Reduced to poverty, always troubled by enemies, failure
      in any undertakings, death of brothers and friends and miserable and complicated life.
      Scorpio :--Starting new schemes and enterprises, realisation of many ambitious things,
      travelling in hilly tracts and countries. Sagittarius :—Happiness, success in all undertakings,
      good health, destruction to enemies, supreme satisfaction in every way. Capricorn :—
      Always roaming about in forests and woods, loss of patrimony, self-respect and good
      name and misunderstanding among his own people. Aquarius :— Mental worries, death of
      wife, loss of property and wealth. Pisces :—Gains in wealth, auspicious celebrations,
      respect among relations, increase in family members and smooth-sailing in every way.
      Sthanabala (Positional Strength) :— Gains from cultivation, lands, conveyances, general
      happiness, good reputation and meritorious work and pilgrimages to holy shrines. Digbala
      (Directional Strength) :—Respect from many directions, happiness, power and pecuniary
      success. Kalabala (Temporal Strength) :—Respect among rulers, success in lands and cultivation.
      Naisargikabala (Natural Strength) :—Unsolicited pleasures and enjoyments, articles of
      comfort, pleasure trips and excursions and much respect. Chestabala (Motional Strength)
      :—Birth of children, felicity and harmony in married life, financial gains and success
      in speculation. 235 The Sun''s sub-period.—3 months, 18 days Unpleasantness with relatives
      and superiors, anxieties, headache, pains in the ear, some tendency to urinary or kidney
      troubles, sickness, fear from kings and enemies, fear of death loss of money, danger
      to father if the Sun is afflicted, stomachache and travels, gains through religious
      people, mental sufferings, a wandering life in a foreign country. The Moon''s sub-period.—6
      months Winning favours from superiors, increase in business, fresh enterprises, troubles
      through women, eye troubles, many relatives and friends, indulgence in idle pastimes,
      jaundice and kindred ailments, new clothes and ornaments, will be happy, healthy, good
      meals, respect among relatives. Mars'' sub-period.—4 months, 6 days. Rheumatic and similar
      troubles, quarrels, danger of enteric fever, dysentery, troubles to relatives, loss
      of money by thefts or wasteful expenses, failures, acquisition of wealth in the 236
      form of gold and gems, royal favour leading to prosperity, contraction and transmission
      of bilious and other diseases, mental worries, danger from fire, ill-health, loss of
      reputation, sorrow.

      Rahu''s sub-period.—10 months, 24 days Many troubles, changes according to the position
      of Rahu, family disputes, journeys, pang of death, trouble from relatives and enemies,
      loss of peace or mental misery, loss of money, sorrows, unsuccessful in all attempts,
      fear of thieves and reptiles, scandals.

      Jupiter''s sub-periods.—9 months, 18 days Benefits from friends and acquaintances, increase
      in education, employment in high circles, association with people of high rank, success
      through obstacles, birth of a child, wealth got through sons (if there is a son), honour
      to religious people, virtuous acts, good traditional observances, good society and conversations,
      reputation, gains and court-honours.

      Saturn''s sub-period.—11 months, 12 days Constant sickness to family members, much new
      enemies, some loss of property, bodily ailments, much unhappiness, expulsion from home
      or country, accidents, quarrels with relatives, loss of money, diseases, lacking in
      energy, ignoble calls, mental worries, loans, danger from thieves and rulers. Mercury''s
      sub-period.—10 months, 6 days Gain in money, good reputation, gains in new clothes and
      ornaments, new education trouble through relatives, mental distress, depression of spirits,
      waste of money and sight, no comforts, friends becoming enemies, grave anxiety and fears,
      health bad, children ungrateful, disputes and trouble from ruler or judge, suffers disgrace,
      many short journeys and wanderings. Kethu''s sub-period—4 months, 6 days Loss of money,
      affliction of mind with troubles, faintings or nervous exhaustion, mind full of misgivings,
      a long journey to a distant place, change of house due to disputes, troubles among relatives
      and associates, throat disease, mental anguish, ophthalmia or premature death, fear
      from kings or rulers and enemies, diseases, cheated by others. 238 Gain of money, respect
      by rulers and gain of vehicles, a likelihood of marriage, increase of property, illness,
      does many good works, acquisition of pearls or other precious stones, fatigue, addiction
      to immoral females and profitless discussions. The Moon in Aries :—Physical and mental
      happiness, gains in wealth and perfect contentment. Taurus :—Increase in fame and name,
      collection of enormous wealth, mental and physical happiness. Gemini :—Progress in education
      and acquiring of much immovable and movable properties. Cancer :—Addition in wealth,
      success in litigation, unexpected findings of treasure, travels. Leo :—Progress in education,
      much gains from unexpected sources. Virgo :— Death of mother, worries from enemies and
      swindlers, mental and physical restlessness. Libra.—Gains in wealth, increase in friends,
      visits to holy places and shrines, realisation of schemes and destruction of enemies.
      Scorpio :— Fear from political heads, destruction of relatives, disappointments in every
      respect, loss of wealth, liberty and honour at risk and much mental uneasiness. Sagittarius
      :-Domestic happiness and felicity, celebration of happy functions, accumulation of wealth
      and undisturbed progress of normal private affairs. Capricorn :-Increase in lands and
      houses and wealth, success in every new enterprise, pilgrimages to holy places and success
      in litigation. Aquarius :-Destruction of property, fear from political authorities,
      mental worries from enemies, misunderstandings among relatives and friends. Pisces :-Taking
      charge of fresh office, reciting religious texts and moral codes and easy access to
      anything coveted without effort. Ascendant :-The Moon''s dasa produces charitable feeling
      and good friends. Avaroha (moving from exaltation to debilitation):- Losses and troubles
      to wife, mental worry and derangement, displeasure of his own people, fear from rulers,
      wells, poisons and the like. Neecha (debilitation) :-Losses and troubles from various
      sources and mental worry. Moolathrikona :- Respect among sovereigns, money gains, acquisition
      of landed property, much happiness and sexual enjoyment. Devoted attention to learning,
      love of music, good clothings, company of refined society, sound health, good reputation,
      journey to holy places, acquisition of abandoned wealth, power, vehicles and lands,
      marriage, relatives, fortunate deeds, inclination to public life, change of residence,
      birth of a child, increase of wealth, prosperity to relatives. Quarrels and litigation
      among friends and relatives, headlong enterprises, danger of disputes between husband
      and wife, between lovers or in regard to marital affairs, disease, petulence, loss of
      money, waste of wealth, trouble from brothers and friends, danger from fever and fire,
      ghosts, injury from instruments or stones, loss of blood and disease to household animals.
      Distress of risks from falls and dangerous diseases, waste of wealth and loss of relatives
      and no ease to body, loss of money, danger of stirring up enemies, sickness, anxiety,
      enmity of 241 16 superiors and elders, anxiety and trouble through wife, scandals, living
      in forest, diseases of skin, danger from thieves and poison, danger to father and mother,
      suffering from hunger. Increase of property, plenty of food and comforts, prosperous,
      benefits from superiors such as masters or governors, birth of a child, vehicles, abundance
      of clothes and ornaments and success in undertakings, patronage of rulers, gain of property,
      respect, learned. Wife''s death or separation, much mental anguish, loss of property,
      loss of friends, ill-health, mental trouble due to mother, wind and bilious affections,
      harsh words, and discussion with unfriendly people, disease due to indigestion, no peace
      of mind, quarrels with relatives. Acquisition of wealth from maternal relatives, new
      clothes and ornaments, settlement of disputes, pleasure through children or lover, increase
      of wealth, accomplishment of desires, intellectual achievements, new education, good
      honour from rulers, general happiness, enjoyment with females, addiction to betting
      and drinks. Illness to wife, loss of relatives, suffering from stomach-ache, loss of
      property, sickness of a feverish nature, danger from fire, subject to swellings or eruptions,
      eye troubles, mind filled with cares, public criticism or displeasure, dishonour, danger
      to father, mother and children; scandals among equals, eating of prohibited food, bad
      acts, bad company, loss of money and memory. Sudden gains from wife, enjoys comforts
      of agriculture, water products and clothing, suffers from diseases inherited by mother,
      sickness, pain, loss of property, enmity, gain of houses, good works and good meals,
      birth of children, expenses due to marriage or other auspicious acts. Feverish complaints,
      pains in the eyes, success or failure according to position of the Sun and the Moon,
      legal power, free from diseases, decadence of enemies, happiness and prosperity, jaundice,
      dropsy, fever, loss of money, travels, danger to father and mother, piles, weakness,
      loss of children and friends. Mars in Aries :—Excessive gains in wealth, increase in
      reputation and respect, much gains and fame. Taurus :—Destruction of enemies, success
      in all struggles, respect from elders and rulers and good produce from lands. Gemini
      :— Access to great wealth, precious stones and metals, agricultural success, success
      in every work and in every respect. Cancer :—Danger from enemies and rulers, litigation
      troubles, ill-health, loss of honour and reputation, domestic disharmony and misunderstandings
      among brothers or close relatives. Leo :—Happy and successful all through the period
      of 7 years, taste in fine arts and material gains through them, increase in house, grains
      and lands. Virgo :—Beneficial results, successful termination of educational pursuits,
      ability to address meetings and deliver lectures, and happiness from relatives and friends.
      Libra :—Most miserable life, misunderstandings with cousins and brothers, death of wife
      and children, loss of wealth and grains and mortgaging of landed property. Scorpio :—Increase
      in wealth, good earnings, friendship and intimacy with exalted personages, love for
      own people, always happy and active. Sagittarius :—Earnings from political or royal
      sources, courting their friendships, destruction of enemies and realisation of all hopes
      and desires. Capricorn :—Success in battles and respect for military skill, gains from
      quadrupeds and increase in wealth. Aquarius :—Great hardships and difficulties, misunderstandings
      with rulers and the immediate superiors in office, unpleasant things towards mother
      and servants. Pisces :—Much wealth, general success and happiness, bumper crops in lands,
      prosperity and increase of house and business, respect as a learned man, great reputation.
      Mars'' sub-period.—4 months, 27 days

      Great heat, dislike of friends, annoyance from brothers and sisters, danger from rulers,
      failure of all undertakings, danger of hurts according to the sign held by Kuja, trouble
      with superiors and some anxiety through strangers, foreigners or people abroad and through
      warlike clan. Danger of open violence, quarrel with relations, loss of money, skin diseases,
      consumption, loss of blood, fistula, and fissures in anus, loss of females and brothers,
      evil doings and boils. Danger from rulers and robbers, destruction of wealth, success
      in evil pursuits, sufferings from poisonous complaints, loss of relatives, danger from
      skin diseases, change of residence, some severe kind of cutaneous disease, journey to
      a country, scandals, loss of cows and buffaloes, wife, loss of memory, fear from insects
      and thieves, falls into well, beating, famine, danger and fear from ghosts, affection
      of gonorrhoea, fretting and imprisonment. Loss of wealth, enemies, end of the unfortunate
      period, favour from superiors and persons in position, gain of money, birth of children,
      auspicious, acquisition of wealth through holy people, freedom from illness, public
      reputation, ascendancy and happiness. Loss of money, diseases, loss of relatives and
      danger from arms or operation, illness leading to misery, evil threatened by enemies,
      robbers and rulers, loss of wealth, quarrels, disputes, litigation, loss of property,
      cutaneous effects, loss of office or position and much anxiety. Marriage or inclination
      to marriage, knowledge and fruits of knowledge, wealth, bodily evils disappear, slander,
      fear of insects, poisoned by animals or insects, gain of wealth by trades, abundance
      of houses, trouble from enemies and mental worries, service rendered to friends and
      relatives, acquisition of wealth, new knowledge, success in litigation. Enmity and quarrels
      with low people, loss of money due to evil works, commission of sins, great sufferings
      due to troubles from relatives and brothers and opposition of bad people, family disputes,
      troubles with one''s own kindred diseases, poisonous complaints, troubles through women,
      many enemies. Venus'' sub-period.—1 year, 2 months Acquisition of property or gain of
      money, domestic happiness, successful love affairs, inclination towards religious observances
      and festivities, favourable associations, influenced by priests, skin eruptions, boils,
      pleasure from travelling, jewels to wife, clothings, money from relatives and brothers,
      odium of females and their society, increase of intelligence, enjoyment of females and
      gain of money. The Sun''s sub-period.—4 months, 6 days Gain of money in bad ways, destruction
      of ''enemies, good reputation, long journey to fereign lands and peace of mind, blame,
      odium of elders, quarrels with them, sufferings by diseases, heart-ache occasioned by
      one''s own relatives, fever or other inflammatory affection, danger of fire, troubles
      through persons in position, many enemies. Profit, acquisition of wealth, house renovated
      or some improvements effected in the house, comforts of wealth, heavy sleep, ardent
      passion, enjoyment by the help of women. Rahu in Aries:—Auspicious celebrations in the
      house, recitations of sacred texts, acquisition of mastery over great tracts of lands,
