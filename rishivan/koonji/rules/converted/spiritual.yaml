      people, entire change of surroundings, schemes of deception, miserliness, acquisition
      of lost property, dislike of relatives, evil from friends and injury by fire. Means
      of livelihood settled, gains from profession, benefits through superiors or employers
      or persons ruled by Jupiter, fame, anxiety, quarrels with saints and religious men,
      gain of knowledge, end of dependence, worship of certain inferior natural forces, happiness
      and health, marriages, sexual intercourse, increase of family reputation and good deeds,
      wealth, ultimate happiness, wife and children suffer in the end. Sexual intercourse
      with females advanced in age, accession to lands and wealth, disappearance of enemies,
      affection of excretory system, piles, etc., rheumatic pains in legs and hands, danger
      to eyesight, distaste for food, loss of appetite, physical condition poor, loss of money,
      wanderings, servitude, bolting and gambling, addiction to liquor, bad company, etc.,
      ill-health, loss of memory, impotence. Mercury''s sub-period.—2 years, 10 months Association
      with prostitutes, enjoyments knowledge, mathematical learning, success in litigations,
      inclination to learn music, piles and other hot ailments, pleasure through wife and
      children, increase of wealth, gain of knowledge in arts and sciences, wealth, royal
      favour, prosperity on a large scale and sound health. Kethu''s sub-period.—1 year, 2
      months Discordance, death of relatives, injury inflicted by enemies, misgivings in heart,
      deprivation of wealth, troubles through wife, danger from quadrupeds, illness to partner
      or a member of the family, accidental blood poisoning, delirious fits, weakness in body
      and mind, gradual loss of wealth, loss of relatives, bad company, abode in seclusion,
      manifold sorrows, but happiness in the end. A careful study of my book How to Judge
      a Horoscope is also recommended. FATALISTS and atheists may indulge in the hallucinations
      that death is accidental, that it is merely the resolution of the component elements
      of the human body into their former states and that it signifies an end to the activities
      of the soul as it becomes incorporated with the general ethereal currents ; but in reality
      it does not seem to be so. There is much significance attached to this by the Hindus
      as well as other people believing in the existence of a Creator without whose knowledge
      "not even a sparrow falls to the ground". Death does not come all of a sudden ; neither
      does birth take place so. Man does not come from nothingness and disappear into the
      regions of annihilation. There is something mysterious, subtle and un-understandable,
      which controls these various phases of human existence, like birth, life and death.
      This mysterious power does not operate in a blind fashion or without any definite order.
      It transcends all reason, all 281 logic, all commonsense and all imagination. It is
      beyond the reach of senses and sense perception. The presence and operation of this
      power is demonstrable by everyday occurrences. Here comes the importance of the laws
      of Karma and the laws of continuity and evolution. The Hindus grant the existence of
      worlds other than our own and the possibility of the soul migrating into good or bad
      states of future existence after death, according as the Karma done in this world is
      good or bad. As Socrates puts it, death is either the cessation of all human activities
      or the migration of the soul into a happier region. Philosophers say that death is a
      state of transition for the soul to enter into more subtle forms of existence and the
      duration of life in such states of existence depends upon the balance sheet of Karma
      one''s credit at the time to of death here. By ascertaining the length of life beforehand,
      carefully, and the nature and source of death, it may be possible to prevent many catastrophes
      and family strifes in this life, and it may also be possible to prolong the life, if
      so desired, by recourse to remedies prescribed by the ancient Maharshis. Many times
      the sudden death of a person leaves his widow, children and other dependents in a state
      of abject poverty. Adequate provision could have been made for these people if the period
      of death were previously ascertained. The following information will be useful to find
      out the place, nature and source of death, the particular diseases which the native
      suffers from at the time of death, unnatural deaths by drownings, tortures, accidents,
      wild beasts, suicide, murder, etc., which can be prevented, the period of unconsciousness
      before death, the nature of cremation or burial of the dead body, the nature of the
      past and future births and the possibility or otherwise of attaining moksha or emancipation.
      The disease from which a person dies is predicted by the nature of the planet, which
      aspects the 8th house and the part of the body to be affected would be that represented
      by the 8th house in the division under Kalapurusha (see Chapter on Medical Astrology
      for this division). 283 In other words the humour belonging to the planet (which is
      given below) in the 8th house causes the particular disease which produces death. If
      many planets occupy the 8th house, the body will be subject to several attacks resulting
      from an excess of the various humours indicated by such powerful planets and death will
      ensue. If the Sun, the Moon, Mars, Mercury, Jupiter, Venus or Saturn is in the 8th house
      death will be due to fire, water, weapons, fever, chronic diseases, thieves or starvation
      respectively. If the 8th house is a movable, a fixed or a common sign, death occurs
      in a foreign place, own place and while travelling. If the Sun aspects the 8th house,
      the disease will be developed by bile or heat; if the Moon, by wind and bile; if Mars,
      bile or heat; if Mercury, by wind, phlegm and bile; if Jupiter, by phlegm; if Venus,
      by phlegm and wind ; and if Saturn by wind. If one or more of these planets occupy the
      8th, disease prior to death will be from the above-mentioned sources—the sources indicated
      by the particular planet. If no planet occupies or aspects the 8th, then the lord of
      the 8th house must be considered and the source of disease determined from the humours
      indicated by the particular planet. First take the planet occupying the 8th ; if no
      planet is there, consider the one that aspects the 8th ; if no planet aspects it then
      give preference to the lord of the 8th. In the illustration given below the 8th from
      the ascendant is Aries. The Sun and Venus are posited there and are powerfully aspected
      by the Moon who is in the 2nd from birth and by Mars who is in the 5th. Now the diseases
      the native suffered from at his death must be ascertained. The Sun in the 8th—bile ;
      Venus in the 8th—wind and phlegm ; Moon 285 aspecting the 8th—bile and wind; Mars aspecting
      the 8th—bile. Three planets indicate bile, two wind and one phlegm. Therefore the native
      died on account of the disease caused owing to inflammation of excessive bile in the
      head (Aries represents head). According to Ayurveda or the Hindu System of Medicine
      the existence of these tridoshas (wind, bile and phlegm) in a state of harmony constitutes
      health and when some one or more among these doshas is or are increased and some others
      possessed of opposite attributes are diminished, the result is disease. (Vide my book
      Ayurveda, 4th Edition.) Each dosha (humour) causes certain diseases and the exact nature
      of the disease from which a person dies should be ascertained with reference to the
      humour attributed to the planet, ruling, posited in, or aspecting the 8th house in a
      horoscope. The Sun indicates death by fevers, apoplexy, paralysis. The Moon causes death
      by watery diseases, drowning, loose motions, diarrhoea, dysentery, blood impurities.
      286 Mars brings about death by pneumonia, cholera, plague and such other epidemics,
      hæmorrhage, bronchitis, abortion and consequent surgical operation, accidents incidental
      to gun-shots, etc. Mercury makes a person die by fever of brain, smallpox, ague, nervous
      disorders, sleeping sickness, kala-azar, whooping cough and assaults. Jupiter causes
      death by mental worry or by some unknown disease, pleurisy, liver disease, inflammation
      of the lungs, heart failure and spasms. Venus indicates death by excessive thirst, fast,
      excessive heating, syphilis, gonorrhoea. Saturn causes death by suffocation, burns,
      rheumatic fever, paralysis, melancholia and consumption. Accidental death is caused
      by the following combinations. If the Sun and Mars occupy the 10th and 4th at birth,
      death will be due to hurts and injuries received by stone throwing. If Saturn, the Moon
      and Mars are in the 4th, 7th and 10th respectively death occurs by drowning in a well
      or falling into it. The Sun and the Moon, 287 in Virgo with or aspected by malefics,
      cause death by drinking poison or being poisoned by enemies. Apart from the 8th house,
      signifying the source and nature of death, certain other combinations at birth also
      indicate the kind of death. When Mars and Saturn are afflicted, death occurs by suffocation.
      Saturn in Taurus in conjunction with a malefic indicates death by hanging. Death may
      occur in prison if Saturn aspects the Sun or the Moon rising. Saturn in a quadruped
      sign in conjunction with the Sun causes death by shipwreck, fall of buildings, falls
      from elevations and precipices. Saturn in Cancer and the Moon in Capricorn at birth
      cause death by dropsy. The Moon in a sign of Mars or in Virgo with two malefics on either
      side brings about death by emaciation of the body. If the Moon is in Capricorn or Aquarius
      with malefics on either side, death will be due to suicide or fall from a mountain.
      Two malefics in the 5th and 9th houses with no beneficial aspects bring about death
      in prison. If Mars and the Sun are in the 4th, and Saturn in the 10th, the person will
      be crucified. The Sun in the 4th, Mars in the 10th, aspected by the weak Moon, causes
      death from crucifixion. If Mars, the Sun and Saturn occupy the 4th, 7th and 10th respectively,
      death occurs by fire and weapons. Saturn, the Moon and Mars in the 2nd, 4th and 10th
      respectively ceuse death by insect bites or wounds generated in the body. The weak Moon.
      the Sun and Mars in the 10th. 7th and 4th respectively make the person die in the midst
      of night-soil, filth and faecal matter. Saturn in the 8th with weak Moon aspected by
      powerful Mars causes death by surgical operation or piles cr fistula. In case, the above
      combinations do not hold good, then the following must be applied. The 22nd drekkana
      (decanate) declares the cause of death and the lord of that drekkana, kills the person
      by that disease which is attributed to him as given at the beginning of this chapter.
      The place where death occurs will be similar to the sign occupied by the lord of the
      navamsa in which the birih falls. Say the birth falls in the navamsa of Capricorn. Its
      lord is Saturn. In the rasi he is in Taurus. Therefore the nature of the place, death
      occurs in, will be appropriate to Taurus, i.e., the place indicated by the lord of Taurus,
      viz., Venus indicating drawing rooms well furnished with exquisite furniture and tapestry.
      If the lord of the sign occupied by the lord of the navamsa, the ascendant falls in,
      is the Sun-the place of death will be a temple, a forest or a religious institution;
      if the Moon-a fertile place, with green vegetation of a garden; if Mars-hospital, operation
      room, special wards; if Mercury-playground, sports club, gambling den; if Jupiter-treasurehouse,
      public office, court, lawyer''s house; if Venus-rich flats and apartments, nursing houses;
      and if Saturn-dirty places and dens of prostitutes. The period, for which a person will
      remain unconscious before death, will be the time of oblique ascension of the remaining
      portion of the rising sign below horizon. This period must be doubled if the lord of
      the ascendant aspects the birth and trebled if benefics aspect the birth. Example :-Say
      25° Gemini is rising (latitude 28° N.). The remaining portion of Gemini is 5°. Reference
      to oblique ascension tables in App. B 290 gives the duration of Gemini as 5 ghaties
      on 28° N. latitude. The time taken for 5° in Gemini to rise will be 5/30 × 5 = 5/6 ghaties
      or 50 vighaties or 50/60 × 2/5 = 1/3 hour or 20 min. Say Mercury lord of the birth aspects
      Gemini. This time must be doubled — 20 × 2 = 40 minutes. That is the person will be
      unconscious for 40 minutes before he expires. After death takes place, the nature of
      cremation, burial or otherwise should be ascertained with reference to the 22nd drekkana
      (decanate). The 22nd drekkana will be the rising drekkana rather the first drekkana
      in the 8th house. If the 22nd drekkana is fiery, then the body will be cremated and
      turned to ashes. If it is a watery drekkana, the body will be thrown into rivers, waters
      or tanks. If it is neither a fiery drekkana nor a watery one, the body will be left
      uncared for and dissolved by atmospherical forces. The final thing would be to find
      out world the person has come from and whither he will go for his future existence.
      We do not know what exactly is the mystery underlying the phenomenon of death. But it
      is held by all sages that the soul will go to some other world after death, from here
      and this can be ascertained thus— The past birth can be determined by the ruler of the
      decanate occupied by the Sun or the Moon (whichever is more powerful) and accordingly
      the particular Loka or world where the soul has come from. Find out which is stronger
      out of the Sun and the Moon. If the lord of the decanate occupied by the stronger of
      these two planets is Jupiter—the deceased in his past birth belongs to Deva Loka (world
      of immortals). If the decanate belongs to the Moon or Venus the person has come from
      Pitru Loka (world of manes). If the decanate belongs to the Sun or Mars, the deceased
      belongs to Tiriyag Loka (world of lower animals). If Saturn or Mercury is the owner
      of such a decanate, the person has come from Naraka Loka (infernal regions). In the
      previous birth the status or rank of the person was high, mediocre or mean and debilitated
      according as the lord of such a drekkana is exalted, ordinary or debilitated. 292 The
      chapter on death can be brought to a close when we consider, the state of future existence
      of a person after death. If there are no planets in the 6th, 7th and 8th, find out the
      decanate rising in the 6th and 8th and determine the strongest of the two. Then attribute
      that loka or world which is denoted by that planet ruling the above-mentioned decanate.
      If a planet is found in the 6th, 7th or 8th then the person goes to the world indicated
      by the planet. If there are two or more planets, always give preference to the strongest.
      Jupiter

      Moon and Venus

      Sun and Mars

      Saturn and Mercury Deva Loka (world of Immortals)

      Pitru Loka (world of Manes)

      Tiriyag Loka (world of Lower Animals)

      Naraka Loka (world of Infernal Regions) Final emancipation or moksha, the person gets,
      if Jupiter occupies 1, 4, 7, 8 or 10 from the ascendant. This final emancipation or
      moksha is preferred to any other state of existence and it is rare that mortals could
      ever dream of such a rare thing. THIS is a peculiar system of ascertaining the various
      sources of energy for the different planets. Ashtakavarga helps us to determine the
      longevity of a person, the yearly results produced on account of the incessant movements
      of the planets changing their positions from where they were at the time of birth and
      to estimate the stability or otherwise of each bhava or house. Planets will be found
      in certain positions at the time of birth. But at any given time after birth they will
      be found in different situations both from the ascendant and also from their own radix
      positions. Ashtakavarga liberally translated means eight sources of energy for each
      planet including the ascendant. Rahu and Kethu are invariably omitted on account of
      their shadowy nature. The subject-matter of Ashtakavarga is vast. I have, therefore,
      extensively dealt with this subject in my book Ashtakavarga System of Prediction. In
      this chapter I have sketched briefly the important outlines necessary for its study,
      without entering into details. Supposing in a horoscope the Sun is in Cancer. Six months
      hence he will not be in Cancer, but in Sagittarius or Capricorn and in each succeeding
      month he transits over a particular sign and consequently forms different angular positions
      to his own position at birth and those of other planets. Ashtakavarga records the results
      of such transits.'
