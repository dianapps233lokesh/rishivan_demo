- id: BPHS.GENERAL.CH54V4547.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch54.v45-47
    quote: >-
      In the commencement of the Antardasa, enmity with the friends, in the middle of the
      Dasa, a little bit of comfort, and towards the end of the Dasa, conflicts will be the
      results of debilitated Saturn. Besides, there will be grief of parents and a good amount
      of travelling. Saturn, if acquires the lordship of the 2nd or the 7th house, early death
      will be feared. To mitigate these ill effects, one should donate black cow, buffalo
      (female), goat in charity and undertake the Japa of Mrityunjaya. With these acts of
      seeking propitiation, happiness and prosperity could be restored.
    quote_sha256: bd0c8d1dbe09d8c2c9038e75f7d21ec5e4fd86397584ca2b6a9bbc786ed2cec0
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: 54.45.1
    review:
      state: unreviewed
  when:
    dignity:
      subject: graha.saturn
      dignity: dignity.debilitated
  indicates:
    claim: general.protection
    polarity: negative
    magnitude: moderate
    text: enmity with the friends at the commencement of the Antardasa of debilitated Saturn
  timing:
    requires_activation: true
