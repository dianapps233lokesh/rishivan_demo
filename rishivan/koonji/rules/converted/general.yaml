- id: JATAKAPARIJATA.GENERAL.CH9V7374.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol1
    locator: ch9.v73-74
    quote: >-
      Slokas 73-74 Mercury (when in strength) can counteract the evil caused by Rahu. Saturn
      (in a similar position) can counteract the evil influences of the former two combined,
      Mars (when in a position of advantage) can remove the evil caused by the three foregoing
      planets put together. Venus has power to nullify the evil caused by these four. Jupiter
      can destroy the evil worked by the previous five. The Moon can obviate the malefic influence
      of the six preceding. The Sun can remove the evil effects of the foregoing seven. This
      he does more effectually when he is in his northward course.
    quote_sha256: 2ea9f64541f90dca143065b6d8853a3edb02d4e7e08d8b5d421376ba24a49818
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: mercury_rahu_counteract
    review:
      state: unreviewed
  when:
    conjunct:
      subject: graha.mercury
      other: graha.rahu
  indicates:
    claim: general.protection
    polarity: positive
    magnitude: moderate
    text: Mercury counteracts the evil caused by Rahu
