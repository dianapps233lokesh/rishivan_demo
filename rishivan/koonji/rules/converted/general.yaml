    locator: ch62.v38-39
    quote: >-
      If Rahu is placed in the Upachaya houses (3,6,10,11) from the Ascendant, the Antardasa
      of Rahu will be of pleasure renderings. In this duration, destruction of enemies, great
      exuberance, happiness of the king etc., types of auspicious results discernable in the
      first five months of the Antardasa and the end of Antardasa will cause fever and ailment
      of indigestion.
