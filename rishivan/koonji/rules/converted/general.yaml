- id: BPHS.GENERAL.CH36V27.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  source:
    book: bphs
    edition: bphs-gcsharma-vol1
    locator: ch36.v2-7
    quote: >-
      Natural Benefics do not give auspicious effects when they are lords of the angles, and
      natural malefics in that position do not give in auspicious effects, while the lords
      of the trines (whether benefic or malefic) always give auspicious effects. The Lord
      of the Ascendant is especially auspicious as the Ascendant House is both an angle and
      a trine. The 5th and 9th Houses are specially related to wealth and the 7th and the
      10th Houses to happiness. All the planets lording the Trishadayas (the 3rd, 6th and
      11th House) are known as giver of inauspicious effects. The Lords of the 12th, the 2nd
      and the 8th House give effects according to their association (with a benefic or a malefic)
      and give effects according to their second House (the House in which they have their
      2nd sign) and they are stronger in their qualities in the ascending order. Among these
      the 8th Lord when he owns the 12th House from the 9th House is not auspicious and if
      he (the 8th Lord) is the lord of the 3rd, 6th and 11th House also simultaneously he
      becomes still more inauspicious, but if he is the Lord of the trine (1st, 5th or 9th
      Lord) he becomes even more auspicious in giving effects. The stronger among the above
      mentioned combinations becomes the obstructor of the weaker one and gives his own effects.
      Here the 8th Lordship of the Sun and the Moon is not evil.
