    edition: bphs-gcsharma-vol2
    locator: ch54.v23-26
    quote: >-
      23-26½ : If Rahu is placed in Angles or Trines from the Ascendant, in the beginning
      of two months of the Antardasa, heavy loss of wealth will incur and state of psychosis
      fear will exist. In this Antardasa, the fear of theft, snake bites, injury will also
      persist and wife and son will under go sufferings. After two months, good results will
      prevail. Should Rahu have the conjunction of the benefic planets or is situated in a
      benefic Navamsa, sound health, mental satisfaction and affection of the King (Governments)
      are the results. From the Ascendant, if Rahu having a conjunction of Yogakaraka planet
      and is situated in the 3rd, the 6th, the 10th or the 11th (Upachaya) house or in a auspicious
      house, from the lord of the Mahadasa, the native will get recongnition from the King
      (Government), rise is the fortune, fame etc; but wife and children will have some kind
      of sufferings though the birth of child and other festivities will also take place at
      home.
