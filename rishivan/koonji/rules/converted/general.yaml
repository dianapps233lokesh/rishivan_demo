  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  source:
    book: bphs
    edition: bphs-gcsharma-vol2
    locator: ch59.v12-13
    quote: '12-13½ : If Mercury is placed at the 6th, the 8th or the 12th house Brihat Parasara
      Hora Sastra 311


      from the Ascendant or the lord of the Mahadasa or combust or associated with the Sun,
      Mars, Rahu, in the beginning of the Antardasa, there will be coronation; acquisition
      of wealth; administratorship of the country or village. In the middle and end of the
      Dasa, it will cause distress due to diseases, hurdles in the success of every pursuit,
      anxiety and tremendous amount of frightfulness.'
    quote_sha256: 3f8ea50746ac0c6e4dc2fe4df34be0c21b5149597d19736390e1b906cd69e47a
