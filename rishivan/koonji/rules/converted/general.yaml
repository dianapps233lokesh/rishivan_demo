    locator: ch54.v40-42
    quote: >-
      If Saturn is posited in the Angle or Trine, the Mahadasa of the Sun and Antardasa of
      Saturn will produce results like destruction of enemies, abundant happiness, gain of
      wealth and food grains (in a low profile). There will be marriage festivities and other
      auspicious functions in the native's house. Saturn if acquires position of exaltation
      or own sign or in the company of a friendly planet, there will be welfare activities
      at home, accretion of assets, recognition from the king, attainments of national prominence,
      wealth, different kinds of garments etc.
