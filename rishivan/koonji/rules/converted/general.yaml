- id: JATAKAPARIJATA.GENERAL.CH9V105.0002
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol1
    locator: ch9.v105
    quote: >-
      Sloka 105. If the Sun be in स्वक्षेत्र (Swakshetra), the person born will own a fine
      mansion, lead a de- praved life and will suffer from fierce lust, if it be the Moon
      that is in स्वक्षेत्र (Swakshetra), the person born will have power, beauty and wealth,
      if Mars, he will be famed for his agricultural strength, if Mercury, he will be learned,
      if Jupiter be the planet occupying स्वक्षेत्र (Swakshetra), the person born will be
      devoted to poetry, the arts, traditional doctrines and the sacred scriptures, if Venus,
      he will be intellectual and wealthy, if Saturn, the person born will be distinguished
      by fierce prowess but bereft of happiness, if Rahu be the planet in स्वक्षेत्र (Swakshetra),
      the person born will possess fame and wealth
    quote_sha256: b4973f9ac98f366eedd0639cb21c45c7ba8b6c9e1a4a3f0b68593e7f6bb5d30d
    authority_tier: S0
    extraction:
      method: converted
      converter: 1.0.0
      from_rule_key: swakshetra_saturn
    review:
      state: unreviewed
  when:
    dignity:
      subject: graha.saturn
      dignity: dignity.own_sign
  indicates:
    claim: general.protection
    polarity: negative
    magnitude: moderate
    text: person born will be bereft of happiness
- id: JATAKAPARIJATA.GENERAL.CH9V13.0001
  version: 1.0.0
  status: candidate
  school: school.parashari
  assertion: assert_claim
  source:
    book: jataka-parijata
    edition: jatakaparijata-sastri-vol1
    locator: ch9.v1-3
    quote: >-
      Sloka 49. If the Moon in Kataka be aspected severally by the six planets from Mars taken
      in order, the persons born in the six cases will respectively be valiant, honorable,
      endowed with the highest poetical talent, of royal rank, working in iron, and suffering
      from ophthalmia. If the Moon be in Simha under the same aspects, the person born will
      respectively be a king, one speaking learnedly, a wealthy man, a king, a wicked person
      and one that is mighty  If the Moon be in Kanya and be aspected by the several planets
      taken in the same order, the person born in the several cases will be respectively wealthy,
      mighty, lordly, learned, badly behaved and in easy comfortable circumstances
    quote_sha256: 751c2716fb742193e658b7b359b2b0261888cd54afc2d9c2f930f458d3d8aca2
    authority_tier: S0
    extraction:
      method: converted
