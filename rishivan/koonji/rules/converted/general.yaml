      If Rahu is posited in the 8th or the 12th house or combined with or aspected by the
      malefic planets, in the Antardasa of Rahu of Mahadasa of Mars, will cause danger of
      theft, snake bite, injury, loss of animals, fear of gastric or bile diseases, imprisonment
      etc. Rahu, if placed in the 2nd house, loss of wealth and great fear and in the 7th
      house, untimely death will take place. Worship of Naga Deva (God of Serpents), food
      to Brahmins, recitation (Japa) of Mrityunjaya Mantaras will ward off the evil affects
      and provide a sound health.
    quote_sha256: e37f21e551688a448fc21df14d624d1f383ae0d0f8e8b3ee88f7b951606f4015
