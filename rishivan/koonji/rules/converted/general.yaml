    edition: jatakaparijata-sastri-vol1
    locator: ch9.v92
    quote: >-
      Sloka 92 If a person be born when the Moon is in Simha, he will have broad eyes, a beautiful
      face, grave looks and will be happy; if the Moon be in Kanya at a person's birth, the
      latter will be afflicted with a craving for sensual enjoyment, of graceful address,
      eminent in learning and prosperous; if in Tula, the person will view with reverence
      Gods and Brahmanas, show affection... towards his relatives and will be opulent the
      person born when the Moon is in Vrischika will be heedless, ailing, avaricious and given
      to wandering
