        subject: graha.moon
        target: graha.sun
    - occupies_rashi:
        subject: graha.moon
        rashi: rashi.virgo
  indicates:
    claim: general.protection
    polarity: positive
    magnitude: moderate
    text: in easy comfortable circumstances
- id: JATAKAPARIJATA.GENERAL.CH9V65.0004
  version: 1.0.0
