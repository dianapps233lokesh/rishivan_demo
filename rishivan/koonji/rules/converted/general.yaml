      exaltation, own or friendly sign; in Angle, Trine or in the 11th, the 3rd or the 2nd
      house, this period will yield gain of wealth and journies; acquisitions of house, happiness
      through the king, wealth, food grains, animals, village (big estate), land etc. In the
      beginning of the Antardasa, there will be conflicts but the middle and the end will
